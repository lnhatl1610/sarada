openapi: 3.1.0
info:
  title: NÉT Sarada API
  version: 1.0.0
  description: Public catalog and commerce API. Prices are integer VND.
servers:
  - url: http://localhost:8000/api/v1
tags:
  - name: Identity
  - name: Catalog
  - name: Cart
  - name: Checkout
  - name: Orders
  - name: Reviews
  - name: Marketing
  - name: Admin
paths:
  /admin/system/health:
    get:
      tags: [Admin]
      summary: Check admin system service health
      description: Requires system.health. Includes non-secret service state, latency, queue counts, scheduler heartbeat, storage capacity, latest backup age and runtime versions.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current health status, refreshed by the admin page every 30 seconds
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AdminSystemHealth' }
        '403': { description: Missing system.health permission }
  /admin/system/backups:
    get:
      tags: [Admin]
      summary: List private system backup archives and queued runs; requires system.backup
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Private backup metadata and the latest 50 manual run records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemBackupsEnvelope' }
        '403': { description: Missing system.backup permission }
    post:
      tags: [Admin]
      summary: Queue a database and uploaded-media backup; requires system.backup
      security: [{ bearerAuth: [] }]
      responses:
        '202': { description: Backup request queued }
        '409': { description: Another backup is queued or running }
        '503': { description: Archive encryption password is not configured }
        '403': { description: Missing system.backup permission }
  /admin/system/backups/{file}:
    get:
      tags: [Admin]
      summary: Download one private backup ZIP; requires system.backup
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: file, required: true, schema: { type: string, pattern: '^[A-Za-z0-9._-]+\\.zip$' } }
      responses:
        '200': { description: Private ZIP archive, content: { application/zip: { schema: { type: string, format: binary } } } }
        '404': { description: Backup not found }
        '403': { description: Missing system.backup permission }
  /admin/app-info:
    get:
      tags: [Admin]
      summary: Read application and runtime diagnostic details for the authenticated admin
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: API version, runtime versions, environment, timezone, commit identifier, and request correlation ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      app_version: { type: string, description: Set with APP_VERSION. }
                      api_version: { type: string }
                      commit: { type: string, description: Short commit identifier from GIT_COMMIT when configured. }
                      environment: { type: string }
                      php_version: { type: string }
                      laravel_version: { type: string }
                      timezone: { type: string }
                      request_id: { type: [string, 'null'], format: uuid }
  /admin/system/failed-jobs:
    get:
      tags: [Admin]
      summary: List failed queue jobs
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [new, in_progress, waiting_user, done] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Paginated failed jobs with truncated, partially redacted first-line summaries
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/FailedJob' } }
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer }
                      last_page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
  /admin/system/failed-jobs/{job}/retry:
    parameters:
      - { in: path, name: job, required: true, schema: { type: integer, minimum: 1 } }
    post:
      tags: [Admin]
      summary: Retry a failed queue job
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Job returned to the configured queue }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/system/failed-jobs/{job}:
    parameters:
      - { in: path, name: job, required: true, schema: { type: integer, minimum: 1 } }
    delete:
      tags: [Admin]
      summary: Delete a failed queue job record
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Failed job record deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/tags:
    get:
      tags: [Admin]
      summary: List product tags
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 120 } }
        - { in: query, name: sort, schema: { type: string, enum: [name, -name, slug, -slug, products_count, -products_count, created_at, -created_at] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: Paginated tags with product counts }
    post:
      tags: [Admin]
      summary: Create a product tag
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 50 }
                slug: { type: string, maxLength: 80 }
      responses:
        '201': { description: Tag created }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/tags/{tag}:
    put:
      tags: [Admin]
      summary: Update a product tag
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: tag, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 50 }
                slug: { type: string, maxLength: 80 }
      responses:
        '200': { description: Tag updated }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [Admin]
      summary: Update a product tag using the PATCH route alias
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: tag, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 50 }
                slug: { type: string, maxLength: 80 }
      responses:
        '200': { description: Tag updated }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/tags/merge:
    post:
      tags: [Admin]
      summary: Merge product tags into one target tag
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id, source_ids]
              properties:
                target_id: { type: integer }
                source_ids: { type: array, minItems: 1, items: { type: integer } }
      responses:
        '200': { description: Source tags merged and removed }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Generic response that does not reveal account existence, content: { application/json: { schema: { $ref: '#/components/schemas/MessageEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset a password with a one-time token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, password_confirmation]
              properties:
                email: { type: string, format: email }
                token: { type: string }
                password: { type: string, minLength: 8, description: Must not appear in known breach data; k-anonymity sends only a five-character SHA-1 prefix for lookup. }
                password_confirmation: { type: string }
      responses:
        '200': { description: Password reset and sessions revoked, content: { application/json: { schema: { $ref: '#/components/schemas/MessageEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/registration-status:
    get:
      tags: [Identity]
      summary: Read public storefront status, branding, SEO, and analytics configuration
      responses:
        '200':
          description: Public registration, maintenance, branding, SEO, and consent-gated analytics configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorefrontConfigurationEnvelope' }
        '429': { description: Public API rate limit exceeded }
  /auth/register:
    post:
      tags: [Identity]
      summary: Register a storefront account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation, terms]
              properties:
                name: { type: string, maxLength: 160 }
                email: { type: string, format: email }
                phone: { type: [string, 'null'] }
                password: { type: string, minLength: 10, description: Must not appear in known breach data; k-anonymity sends only a five-character SHA-1 prefix for lookup. }
                password_confirmation: { type: string }
                terms: { type: boolean, enum: [true] }
                marketing_consent: { type: boolean, default: false, description: Optional marketing email consent, stored separately from required terms acceptance. }
      responses:
        '202': { description: Account created with pending_approval status; verification email sent; no session issued, content: { application/json: { schema: { $ref: '#/components/schemas/StorefrontRegistrationEnvelope' } } } }
        '403': { description: Public registration is disabled in store security settings }
        '422': { $ref: '#/components/responses/ValidationError' }
  /staff-invitations/{token}:
    get:
      tags: [Identity]
      summary: Inspect a pending staff invitation without exposing its token hash
      parameters: [{ in: path, name: token, required: true, schema: { type: string } }]
      responses:
        '200': { description: "Invitation email, assigned role, and expiry" }
        '404': { description: "Invitation is invalid, expired, revoked, or already accepted" }
  /staff-invitations/{token}/accept:
    post:
      tags: [Identity]
      summary: Accept invitation, set password, and create active verified staff account
      parameters: [{ in: path, name: token, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name, password, password_confirmation, terms], properties: { name: { type: string, minLength: 2, maxLength: 160 }, password: { type: string, minLength: 10, description: Must not appear in known breach data; k-anonymity sends only a five-character SHA-1 prefix for lookup. }, password_confirmation: { type: string }, terms: { type: boolean, enum: [true] } } }
      responses:
        '201': { description: Invitation accepted and account created }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/resend-verification:
    post:
      tags: [Identity]
      summary: Resend a pending registration email verification link without revealing account existence
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        '200': { description: Generic response regardless of account existence, content: { application/json: { schema: { $ref: '#/components/schemas/MessageEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/login:
    post:
      tags: [Identity]
      summary: Sign in to storefront by email or phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              anyOf: [{ required: [identifier] }, { required: [email] }]
              properties:
                identifier: { type: string, maxLength: 255, description: Storefront email address or phone number }
                email: { type: string, format: email, deprecated: true, description: Legacy email-only request field; use identifier for email or phone sign-in }
                password: { type: string }
                remember_me: { type: boolean, description: When true, make the refresh cookie persistent for the configured session lifetime. When omitted by legacy clients, defaults to true. }
      responses:
        '200': { description: Access bearer token; refresh credential is set as an httpOnly session cookie unless remember_me is true, content: { application/json: { schema: { $ref: '#/components/schemas/StorefrontLoginEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/passkeys/options:
    post:
      tags: [Identity]
      summary: Start passwordless storefront passkey authentication
      description: Starts a discoverable-credential ceremony without revealing whether an account or passkey exists. Complete it within five minutes.
      responses:
        '200': { description: WebAuthn request options and one-time challenge identifier, content: { application/json: { schema: { $ref: '#/components/schemas/PasskeyChallengeEnvelope' } } } }
  /auth/passkeys/login:
    post:
      tags: [Identity]
      summary: Verify a storefront passkey and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasskeyLoginRequest' }
      responses:
        '200': { description: Short-lived access JWT and a session-only httpOnly refresh cookie, content: { application/json: { schema: { $ref: '#/components/schemas/StorefrontLoginEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/refresh:
    post:
      tags: [Identity]
      summary: Rotate storefront refresh cookie
      responses:
        '200': { description: New short-lived access bearer token and rotated cookie, content: { application/json: { schema: { $ref: '#/components/schemas/StorefrontRefreshEnvelope' } } } }
        '401': { description: Refresh session is invalid or expired }
  /auth/logout:
    post:
      tags: [Identity]
      summary: Revoke storefront access and refresh credentials
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Signed out, content: { application/json: { schema: { $ref: '#/components/schemas/MessageEnvelope' } } } }
  /auth/me:
    get:
      tags: [Identity]
      summary: Get current storefront user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current profile and permissions, content: { application/json: { schema: { $ref: '#/components/schemas/StorefrontIdentityEnvelope' } } } }
  /account/passkeys:
    get:
      tags: [Identity]
      summary: List the current customer's registered passkeys
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Passkeys without credential material, content: { application/json: { schema: { $ref: '#/components/schemas/PasskeyListEnvelope' } } } }
    post:
      tags: [Identity]
      summary: Register a passkey for the current customer
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterPasskeyRequest' }
      responses:
        '201': { description: Passkey registered, content: { application/json: { schema: { $ref: '#/components/schemas/PasskeyEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /account/passkeys/options:
    post:
      tags: [Identity]
      summary: Start passkey registration for the current customer
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: WebAuthn creation options and one-time challenge identifier, content: { application/json: { schema: { $ref: '#/components/schemas/PasskeyChallengeEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /account/passkeys/{passkey}:
    delete:
      tags: [Identity]
      summary: Remove one of the current customer's passkeys
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: passkey, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Passkey removed, content: { application/json: { schema: { $ref: '#/components/schemas/MessageEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /account/profile:
    put:
      tags: [Identity]
      summary: Update the current user's profile details
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200': { description: Updated profile, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [Identity]
      summary: Update the current storefront profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200': { description: Updated profile, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /account/phone/change:
    post:
      tags: [Identity]
      summary: Request an SMS verification code before changing the account phone number
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneChangeRequest' }
      responses:
        '202':
          description: A six-digit code was sent to the new Vietnamese phone. The code expires after ten minutes and can be attempted up to five times.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhoneChangeChallengeEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /account/phone/change/confirm:
    post:
      tags: [Identity]
      summary: Confirm an account phone change using the SMS code
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneChangeConfirmation' }
      responses:
        '200': { description: Phone changed and verified, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /email/verify/{id}/{hash}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - { in: path, name: hash, required: true, schema: { type: string } }
    get:
      tags: [Identity]
      summary: Verify an email using the signed notification link
      responses:
        '200': { description: Email verified }
        '403': { description: Signature or email hash is invalid }
  /account:
    get:
      tags: [Identity]
      summary: Get current account profile and verification state
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current profile, account state, timestamps, verification state, and pending email address when a request exists, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileEnvelope' } } } }
    delete:
      tags: [Identity]
      summary: Soft delete a customer account when no active order exists
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountDeleteInput' }
      responses:
        '200': { description: Account soft deleted, content: { application/json: { schema: { $ref: '#/components/schemas/MessageEnvelope' } } } }
        '403': { description: Only customer accounts can be deleted }
        '422': { $ref: '#/components/responses/ValidationError' }
  /account/avatar:
    post:
      tags: [Identity]
      summary: Upload a profile avatar (JPG, PNG, WebP, up to 2 MB)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [avatar], properties: { avatar: { type: string, format: binary } } }
      responses:
        '200': { description: Uploaded avatar URL, content: { application/json: { schema: { $ref: '#/components/schemas/AccountAvatarEnvelope' } } } }
        '429': { description: Authenticated upload rate limit exceeded }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Identity]
      summary: Remove current profile avatar
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Avatar removed, content: { application/json: { schema: { $ref: '#/components/schemas/AccountAvatarEnvelope' } } } }
  /account/email:
    put:
      tags: [Identity]
      summary: Request an email change while keeping the current address active until confirmation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountEmailChangeInput' }
      responses:
        '200': { description: Pending email address and one-hour confirmation expiry; current account email remains unchanged, content: { application/json: { schema: { $ref: '#/components/schemas/AccountEmailChangeEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /account/email/verify/{token}:
    get:
      tags: [Identity]
      summary: Confirm an account email change with its single-use token
      parameters:
        - { in: path, name: token, required: true, schema: { type: string, minLength: 64, maxLength: 64 } }
      responses:
        '302': { description: Redirect to account security after confirming the address }
        '403': { description: "Token is missing, expired, or already consumed" }
        '409': { description: The address was claimed by another account before confirmation }
  /account/password:
    put:
      tags: [Identity]
      summary: Change password and optionally revoke other sessions
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountPasswordChangeInput' }
      responses:
        '200': { description: Password changed, content: { application/json: { schema: { $ref: '#/components/schemas/AccountPasswordChangedEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /account/security/two-factor:
    get:
      tags: [Identity]
      summary: Read the current admin's two-factor status
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Enabled state and remaining recovery-code count }
    delete:
      tags: [Identity]
      summary: Disable admin two-factor authentication
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { current_password: { type: string, format: password, description: Optional after admin sudo confirmation; the current TOTP code is always required. }, code: { type: string, pattern: '^[0-9]{6}$' } } }
      responses:
        '200': { description: Two-factor authentication disabled }
        '422': { $ref: '#/components/responses/ValidationError' }
  /account/security/two-factor/setup:
    post:
      tags: [Identity]
      summary: Start TOTP enrollment for the current admin
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { current_password: { type: string, format: password, description: Optional after admin sudo confirmation within the last ten minutes. } } }
      responses:
        '200': { description: Enrollment QR code and manual entry key }
  /account/security/two-factor/confirm:
    post:
      tags: [Identity]
      summary: Confirm TOTP enrollment and receive one-time recovery codes
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string, pattern: '^[0-9]{6}$' } } }
      responses:
        '200': { description: Enrollment confirmed; recovery codes are shown once }
        '422': { $ref: '#/components/responses/ValidationError' }
  /account/security/two-factor/recovery-codes:
    post:
      tags: [Identity]
      summary: Replace recovery codes after password and TOTP confirmation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [current_password, code], properties: { current_password: { type: string, format: password }, code: { type: string, pattern: '^[0-9]{6}$' } } }
      responses:
        '200': { description: New one-time recovery codes }
  /account/email/verification-notification:
    post:
      tags: [Identity]
      summary: Resend email verification notification
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Verification message sent, content: { application/json: { schema: { $ref: '#/components/schemas/MessageEnvelope' } } } }
  /account/sessions:
    get:
      tags: [Identity]
      summary: List current user's active Sanctum sessions
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1 }, description: "Optional page number. When page or per_page is supplied, the response includes pagination metadata." }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100 }, description: Optional page size; defaults to 20 for paginated requests. }
        - { in: query, name: sort, schema: { type: string, enum: [last_used_at, -last_used_at, created_at, -created_at, ip, -ip, device_info, -device_info], default: -last_used_at }, description: Current session remains first; other sessions sort by the requested field. }
      responses:
        '200':
          description: Active sessions with parsed browser, operating system, device type, and current session marker. Pagination metadata is returned when page or per_page is supplied; requests without pagination parameters keep the legacy response shape. Sort keeps the current session first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSessionsEnvelope' }
    delete:
      tags: [Identity]
      summary: Revoke every other session
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Other sessions revoked, content: { application/json: { schema: { $ref: '#/components/schemas/MessageEnvelope' } } } }
  /account/sessions/{session}:
    parameters:
      - { in: path, name: session, required: true, schema: { type: integer } }
    delete:
      tags: [Identity]
      summary: Revoke a different session owned by the current user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Session revoked, content: { application/json: { schema: { $ref: '#/components/schemas/MessageEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /account/sessions/{session}/report:
    parameters:
      - { in: path, name: session, required: true, schema: { type: integer, minimum: 1 } }
    post:
      tags: [Identity]
      summary: Report an unfamiliar admin session, revoke it, and require password change
      description: Admin sessions only. A successful report revokes the selected session and refresh token, sets must_change_password for the reporting admin, and sends a mandatory security alert. Other admin API requests are blocked until the password is changed; the admin must enable two-factor authentication afterward.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Session revoked and password change required
          content:
            application/json:
              schema:
                type: object
                required: [message, data]
                properties:
                  message: { type: string }
                  data: { type: object, required: [must_change_password], properties: { must_change_password: { type: boolean, const: true } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Rate limit exceeded }
  /account/push-subscriptions:
    get:
      tags: [Identity]
      summary: List the authenticated account's browser push devices and VAPID public key
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Owner-scoped browser subscriptions and push configuration status for the current account audience
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [public_key, configured, subscriptions]
                    properties:
                      public_key: { type: [string, 'null'] }
                      configured: { type: boolean }
                      subscriptions:
                        type: array
                        items:
                          type: object
                          required: [id, endpoint, device_name, created_at]
                          properties:
                            id: { type: integer }
                            endpoint: { type: string, maxLength: 1024, description: Owner-scoped endpoint used by the browser to match its local subscription; do not display it }
                            device_name: { type: [string, 'null'] }
                            created_at: { type: string, format: date-time }
    post:
      tags: [Identity]
      summary: Register or update a browser push subscription for the authenticated account
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string, format: uri, maxLength: 1024 }
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh: { type: string, maxLength: 255 }
                    auth: { type: string, maxLength: 255 }
                content_encoding: { type: string, enum: [aes128gcm, aesgcm] }
                device_name: { type: string, maxLength: 100 }
      responses:
        '201': { description: Subscription saved for the current user }
        '422': { $ref: '#/components/responses/ValidationError' }
  /account/push-subscriptions/{subscription}:
    delete:
      tags: [Identity]
      summary: Revoke one of the authenticated account's browser push subscriptions
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: subscription, required: true, schema: { type: integer } }
      responses:
        '200': { description: Subscription revoked }
        '404': { description: Subscription does not belong to the authenticated admin }
  /account/push-subscriptions/test:
    post:
      tags: [Identity]
      summary: Queue a test browser push notification for the authenticated admin
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Test push queued }
        '422': { description: No browser subscription is registered }
        '503': { description: VAPID keys are not configured }
  /account/preferences/export:
    get:
      tags: [Identity]
      summary: Export the authenticated admin's appearance preferences as versioned JSON
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Versioned appearance preferences backup
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, exported_at, settings]
                properties:
                  schema_version: { type: integer, enum: [1] }
                  exported_at: { type: string, format: date-time }
                  settings:
                    type: object
                    required: [admin_appearance]
                    properties:
                      admin_appearance: { type: object, additionalProperties: true }
        '403': { description: Admin account required }
  /account/preferences/import:
    post:
      tags: [Identity]
      summary: Import a versioned appearance preferences backup for the authenticated admin
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schema_version, settings]
              properties:
                schema_version: { type: integer, enum: [1] }
                exported_at: { type: string, format: date-time }
                settings:
                  type: object
                  required: [admin_appearance]
                  properties:
                    admin_appearance: { type: object, additionalProperties: true }
      responses:
        '200': { description: Appearance preferences imported after current schema validation }
        '403': { description: Admin account required }
        '422': { description: Unsupported backup version or invalid preference data }
  /account/preferences:
    get:
      tags: [Identity]
      summary: Read the authenticated user's saved admin preferences
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Preferences keyed by supported preference group
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: { type: object, additionalProperties: true }
    put:
      tags: [Identity]
      summary: Save an authenticated admin's notification, security alert, appearance, onboarding, or changelog preferences
      description: Disabling new-device or failed-login alerts requires an active ten-minute sudo session. Credential-change alerts cannot be disabled.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key: { type: string, enum: [admin_appearance, admin_notifications, security_alerts, admin_dnd, admin_digest, admin_session_security, admin_onboarding, admin_changelog] }
                value:
                  type: object
                  additionalProperties: true
                  properties:
                    locale: { type: string, enum: [vi, en], description: Account's preferred admin interface language }
                    theme: { type: string, enum: [light, dark, system], default: light, description: New admin accounts use the light theme by default. }
                    accent: { type: string, enum: [burgundy, blue, emerald, violet, teal, amber] }
                    font_size: { type: integer, enum: [14, 16, 18] }
                    zoom: { type: integer, enum: [90, 100, 110, 125] }
                    show_breadcrumbs: { type: boolean }
                    high_contrast: { type: boolean }
                    strong_focus: { type: boolean }
                    date_format: { type: string, enum: [dmy, ymd, relative] }
                    time_format: { type: string, enum: ['24h', '12h'] }
                    number_locale: { type: string, enum: ['vi-VN', 'en-US'] }
                    currency_position: { type: string, enum: [suffix, prefix] }
                    week_start: { type: integer, enum: [1, 7] }
                    dashboard_default_period: { type: string, enum: ['7', '30', '90'], description: Default date range for the admin dashboard }
                    dashboard_compare_previous: { type: boolean, description: Show comparison with the preceding period by default }
                    remember_collapsed_groups: { type: boolean, description: Remember collapsed admin navigation groups in this browser for the signed-in account }
                    pinned_pages: { type: array, maxItems: 8, uniqueItems: true, items: { type: string, enum: [dashboard, orders, products, inventory, personalTasks] }, description: Ordered page IDs pinned at the top of the admin sidebar; links are filtered by current permissions }
                    dashboard_widgets: { type: array, uniqueItems: true, items: { type: string, enum: [metrics, alerts, revenue, recent_orders, breakdown, top_products, recent_activity] }, description: Ordered visible dashboard widget IDs; omitted known IDs are hidden }
                    default_landing_page: { type: string, enum: [dashboard, orders, products, inventory, personalTasks], description: First permitted admin page to open when signing in without a requested return URL }
                    table_density: { type: string, enum: [comfortable, compact] }
                    table_column_defaults:
                      type: object
                      maxProperties: 100
                      additionalProperties:
                        type: array
                        maxItems: 80
                        uniqueItems: true
                        items: { type: string, maxLength: 100 }
                      description: Account-synced visible column IDs indexed by stable admin table IDs
                    page_size: { type: integer, enum: [10, 20, 50, 100] }
                    sidebar_collapsed: { type: boolean, default: false, description: The sidebar navigation starts expanded; its individual table-of-contents groups start collapsed. }
                    reduce_motion: { type: boolean }
                    shortcuts_enabled: { type: boolean, description: Enable or disable all admin keyboard shortcuts }
                    shortcuts:
                      type: object
                      description: Account-synced configurable bindings for the admin search, sidebar, lock, and shortcut help actions
                      properties:
                        search: { type: string, enum: ["ctrl+k", "ctrl+shift+k", "alt+k"] }
                        sidebar: { type: string, enum: ["ctrl+b", "ctrl+shift+b", "alt+b"] }
                        lock: { type: string, enum: ["ctrl+l", "ctrl+shift+l", "alt+l"] }
                        help: { type: string, enum: ["?", "ctrl+shift+?", "alt+?"] }
                    new_order: { $ref: '#/components/schemas/NotificationChannels' }
                    delivery_failed: { $ref: '#/components/schemas/NotificationChannels' }
                    low_stock: { $ref: '#/components/schemas/NotificationChannels' }
                    review_pending: { $ref: '#/components/schemas/NotificationChannels' }
                    staff_pending: { $ref: '#/components/schemas/NotificationChannels' }
                    weekly_report: { $ref: '#/components/schemas/NotificationChannels' }
                    export_complete: { $ref: '#/components/schemas/NotificationChannels' }
                    admin_digest:
                      oneOf:
                        - $ref: '#/components/schemas/NotificationChannels'
                        - type: object
                          required: [frequency, time, sections]
                          properties:
                            frequency: { type: string, enum: [off, daily, weekly] }
                            time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
                            sections: { type: array, maxItems: 5, uniqueItems: true, items: { type: string, enum: [orders, revenue, low_stock, reviews, overdue_tasks] } }
                      type: object
                      required: [enabled]
                      properties:
                        enabled: { type: boolean, description: Whether recent page and record tracking is enabled }
                    admin_session_security:
                      type: object
                      required: [idle_timeout_minutes, auto_lock_minutes]
                      properties:
                        idle_timeout_minutes: { type: integer, enum: [0, 15, 30, 60, 120], description: Auto logout after inactivity in minutes; zero disables it }
                        auto_lock_minutes: { type: integer, enum: [0, 5, 10, 15, 30, 60], description: Lock the current admin screen after inactivity; zero disables automatic locking }
                    task_reminder: { $ref: '#/components/schemas/NotificationChannels' }
                    new_device: { type: boolean, description: Security alert for a new login device or IP }
                    credentials_changed: { type: boolean, description: Always enabled for credential and two-factor changes }
                    failed_logins: { type: boolean, description: Security alert after five failed admin logins }
                    until: { type: [string, 'null'], format: date-time, description: Temporary quiet mode expiry; a far-future timestamp represents manual mode until disabled }
                    allow_urgent: { type: boolean, default: true, description: Allow urgent email during quiet mode; security alerts always bypass it }
                    frequency: { type: string, enum: [off, daily, weekly], description: Admin digest schedule; weekly runs on Monday }
                    time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: Local time in the admin profile timezone }
                    sections: { type: array, maxItems: 5, uniqueItems: true, items: { type: string, enum: [orders, revenue, low_stock, reviews, overdue_tasks] } }
                    enabled: { type: boolean, description: Whether to record recently opened admin pages and records }
                    schedule:
                      type: array
                      maxItems: 7
                      items:
                        type: object
                        required: [days, start, end]
                        properties:
                          days: { type: array, minItems: 1, maxItems: 7, uniqueItems: true, items: { type: integer, minimum: 1, maximum: 7, description: ISO weekday where Monday is 1 and Sunday is 7 } }
                          start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
                          end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
                    completed: { type: array, description: IDs of completed admin onboarding steps, items: { type: string } }
                    dismissed: { type: boolean, description: Whether the introduction tour was dismissed before completion. }
                    snoozed_until: { type: [string, 'null'], format: date-time, description: Automatically show the unfinished introduction tour again after this timestamp; this pause is shared across the admin's devices. }
                    last_seen_version: { type: string, maxLength: 40, description: Last changelog version viewed by the admin. }
                    menu_layout:
                      type: object
                      description: Admin-only account menu preferences.
                      required: [hidden, order]
                      properties:
                        hidden:
                          type: array
                          maxItems: 12
                          uniqueItems: true
                          items: { type: string, enum: [profile, frequent, account, notifications, workspace, appearance, data, quick_navigation, quick_create, system, store, help] }
                        order:
                          type: array
                          minItems: 12
                          maxItems: 12
                          uniqueItems: true
                          items: { type: string, enum: [profile, frequent, account, notifications, workspace, appearance, data, quick_navigation, quick_create, system, store, help] }
      responses:
        '200': { description: Preference group saved }
        '403': { description: Recent password confirmation is required to disable security alerts }
        '422': { $ref: '#/components/responses/ValidationError' }
  /account/menu-summary:
    get:
      tags: [Identity]
      summary: Read permission-filtered counts for the admin account menu
      description: Requires an admin audience token. Results are cached per admin for up to 60 seconds.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Summary counts for available account-menu features
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [notifications_unread, notifications_muted, tasks_overdue, tasks_today, security_warnings, unrecognized_login, email_verified_at, two_factor_enabled, has_admin_role, staff_code, failed_jobs, quick_links, system_health, presence, last_login_at, last_login_ip, last_login_user_agent, timezone, profile_checklist]
                    properties:
                      notifications_unread: { type: integer, minimum: 0 }
                      notifications_muted: { type: boolean, description: Whether temporary DND or the current weekly quiet-hours window is active }
                      tasks_overdue: { type: integer, minimum: 0 }
                      tasks_today: { type: integer, minimum: 0 }
                      security_warnings: { type: integer, minimum: 0 }
                      unrecognized_login: { type: boolean, description: "Whether an unread, unsnoozed new-device alert needs review" }
                      email_verified_at: { type: [string, 'null'], format: date-time }
                      two_factor_enabled: { type: boolean }
                      has_admin_role: { type: boolean }
                      staff_code: { type: [string, 'null'] }
                      failed_jobs: { type: integer, minimum: 0, description: "Count of failed jobs, returned as zero when the admin lacks system.health" }
                      quick_links:
                        type: object
                        required: [orders_pending, orders_overdue, orders_cancel_return_requests, payments_failed, reviews_pending, low_stock, coupons_expiring]
                        properties:
                          orders_pending: { type: integer, minimum: 0 }
                          orders_overdue: { type: integer, minimum: 0, description: Confirmed or processing orders unchanged for at least 24 hours; zero without orders.view }
                          orders_cancel_return_requests: { type: integer, minimum: 0, description: Pending cancellation and return requests; zero without orders.view }
                          payments_failed: { type: integer, minimum: 0 }
                          reviews_pending: { type: integer, minimum: 0 }
                          low_stock: { type: integer, minimum: 0 }
                          coupons_expiring: { type: integer, minimum: 0, description: "Active, usable coupons expiring within seven days; zero without coupons.view" }
                      system_health: { type: string, enum: [ok, warning, error, unavailable], description: System status is returned only to admins with system.health; otherwise unavailable }
                      presence: { type: string, enum: [available, busy, away, hidden] }
                      last_login_at: { type: [string, 'null'], format: date-time }
                      last_login_ip: { type: [string, 'null'] }
                      last_login_user_agent: { type: [string, 'null'], maxLength: 255 }
                      timezone: { type: string, description: IANA timezone from the current admin profile }
                      profile_checklist:
                        type: object
                        required: [completed, total, items]
                        properties:
                          completed: { type: integer, minimum: 0 }
                          total: { type: integer, minimum: 1 }
                          items:
                            type: array
                            items:
                              type: object
                              required: [id, label, href, complete]
                              properties:
                                id: { type: string }
                                label: { type: string }
                                href: { type: string }
                                complete: { type: boolean }
        '401': { description: "Missing, expired, or non-admin access token" }
  /account/sudo:
    get:
      tags: [Identity]
      summary: Check recent-authentication state for the current admin session
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Session-scoped sudo mode state
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [active, expires_at, requires_two_factor]
                    properties:
                      active: { type: boolean }
                      expires_at: { type: string, format: date-time, nullable: true }
                      requires_two_factor: { type: boolean }
    post:
      tags: [Identity]
      summary: Enter ten-minute sudo mode for the current admin session
      description: Requires the current password and a TOTP code when two-factor authentication is enabled.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password: { type: string, writeOnly: true }
                two_factor_code: { type: string, pattern: '^\\d{6}$', writeOnly: true }
      responses:
        '200': { description: Password verified; sudo mode expires in ten minutes }
        '422': { description: Current password or two-factor code is invalid }
        '429': { description: Too many sudo-mode attempts }
  /account/unlock:
    post:
      tags: [Identity]
      summary: Unlock the current admin screen with password and optional TOTP
      description: Verifies the authenticated admin without issuing or revoking a session. Rate limited to five attempts per minute.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password: { type: string, writeOnly: true }
                two_factor_code: { type: string, pattern: '^\\d{6}$', writeOnly: true, description: Required when TOTP is enabled on the admin account }
      responses:
        '200':
          description: Screen unlocked; the existing session remains active
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, required: [unlocked], properties: { unlocked: { type: boolean, const: true } } }
                  message: { type: string }
        '422': { description: Password or TOTP is invalid }
        '429': { description: Too many unlock attempts }
  /account/tokens:
    get:
      tags: [Identity]
      summary: List the authenticated admin's personal API tokens
      description: Returns token metadata only; token hashes and plaintext are never included. Requires api_tokens.manage.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Personal API token list and allowed scopes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [tokens, permissions, requires_two_factor, allow_non_expiring]
                    properties:
                      tokens:
                        type: array
                        items:
                          type: object
                          required: [id, name, permissions, created_at, last_used_at, last_used_ip, expires_at]
                          properties:
                            id: { type: integer }
                            name: { type: string }
                            permissions: { type: array, items: { type: string } }
                            created_at: { type: string, format: date-time }
                            last_used_at: { type: string, format: date-time, nullable: true }
                            last_used_ip: { type: string, nullable: true }
                            expires_at: { type: string, format: date-time, nullable: true }
                      permissions: { type: array, items: { type: string } }
                      requires_two_factor: { type: boolean }
                      allow_non_expiring: { type: boolean }
        '401': { description: Missing or expired admin session }
        '403': { description: Missing api_tokens.manage permission }
    post:
      tags: [Identity]
      summary: Create a personal API token
      description: Requires active ten-minute sudo mode. Plaintext token is returned once only. Maximum 10 tokens per admin.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, permissions, expires_in]
              properties:
                name: { type: string, maxLength: 120 }
                permissions: { type: array, minItems: 1, maxItems: 20, items: { type: string } }
                expires_in: { oneOf: [{ type: integer, enum: [7, 30, 90] }, { type: string, enum: [never] }] }
      responses:
        '201':
          description: Token created; plaintext is returned once
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
                      permissions: { type: array, items: { type: string } }
                      created_at: { type: string, format: date-time }
                      expires_at: { type: string, format: date-time, nullable: true }
                      token: { type: string, readOnly: true, description: Plaintext is displayed once when the token is created. }
                  message: { type: string }
        '422': { description: "Validation failed, invalid sudo confirmation, unavailable scope, or token limit reached" }
        '403': { description: Sudo mode is required; enter it with POST /account/sudo }
        '429': { description: Too many token creation attempts }
  /account/tokens/{token}:
    delete:
      tags: [Identity]
      summary: Revoke one of the authenticated admin's personal API tokens
      description: Requires active ten-minute sudo mode. Token must belong to the authenticated admin.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Token revoked }
        '404': { description: Token not found or does not belong to this admin }
        '403': { description: Sudo mode is required; enter it with POST /account/sudo }
        '429': { description: Too many token revocation attempts }
  /account/login-history:
    get:
      tags: [Identity]
      summary: List login attempts belonging to the authenticated admin
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: result, schema: { type: string, enum: [success, bad_password, bad_2fa, locked, passkey] } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Paginated login attempts for the current admin only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginAttemptList' }
  /account/security-score:
    get:
      tags: [Identity]
      summary: Calculate account security score and actionable checks
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Security score and check results for the current admin
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [score, level, checks]
                    properties:
                      score: { type: integer, minimum: 0, maximum: 100 }
                      level: { type: string, enum: [strong, fair, needs_attention] }
                      checks:
                        type: array
                        items:
                          type: object
                          required: [key, label, passed, points]
                          properties:
                            key: { type: string }
                            label: { type: string }
                            passed: { type: boolean }
                            points: { type: integer }
  /account/presence:
    put:
      tags: [Identity]
      summary: Update the authenticated admin's presence
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [available, busy, away, invisible] }
                until: { type: [string, 'null'], format: date-time }
      responses:
        '200': { description: Presence updated }
        '422': { $ref: '#/components/responses/ValidationError' }
  /account/presence/activity:
    post:
      tags: [Identity]
      summary: Record recent activity for the authenticated admin
      description: Rate limited. Updates the last activity timestamp used to derive automatic away status after 15 minutes without user activity.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Activity timestamp recorded
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [last_seen_at]
                    properties:
                      last_seen_at: { type: string, format: date-time }
        '429': { description: Activity heartbeat rate limit exceeded }
  /me/task-assignees:
    get:
      tags: [Identity]
      summary: List active admin accounts available for task assignment
      description: Requires tasks.assign. Returns account IDs and display names only.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Available task assignees
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: integer }
                        name: { type: string }
        '403': { description: Missing tasks.assign permission }
  /me/performance:
    get:
      tags: [Identity]
      summary: Read the authenticated admin's personal performance metrics
      description: Order, inventory, and review metrics are null when the admin lacks the corresponding view or moderation permission. Review counts are available from the review audit rollout onward.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: range, schema: { type: string, enum: [today, 7d, 30d], default: 7d } }
      responses:
        '200':
          description: Current-period metrics, preceding-period comparison, and a daily timeline in the admin's timezone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalPerformance' }
        '401': { description: Missing or expired admin session }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/reminders:
    get:
      tags: [Identity]
      summary: List upcoming and overdue reminders owned by the authenticated admin
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 1000000 } }
      responses:
        '200':
          description: Paginated owner-scoped reminders ordered by reminder time
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalTaskList' }
  /me/tasks:
    get:
      tags: [Identity]
      summary: List tasks assigned to or owned by the authenticated admin
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: tab, schema: { type: string, enum: [today, upcoming, overdue, done, assigned] } }
        - { in: query, name: priority, schema: { type: string, enum: [low, normal, high, urgent] } }
        - { in: query, name: subject_type, schema: { type: string, enum: [order, product, customer, inventory] } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Paginated, owner-scoped task resources
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalTaskList' }
    post:
      tags: [Identity]
      summary: Create a personal task or assign one with tasks.assign
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                user_id: { type: integer, minimum: 1, description: Other assignee requires tasks.assign }
                title: { type: string, minLength: 1, maxLength: 255 }
                description: { type: string, maxLength: 10000 }
                priority: { type: string, enum: [low, normal, high, urgent] }
                status: { type: string, enum: [todo, doing, done] }
                due_at: { type: string, format: date-time, nullable: true }
                remind_at: { type: string, format: date-time, nullable: true }
                repeat_rule: { type: string, enum: [daily, weekly], nullable: true }
                subject_type: { type: string, enum: [order, product, customer, inventory], nullable: true }
                subject_id: { type: integer, minimum: 1, nullable: true }
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalTaskEnvelope' }
        '403': { description: Assignment permission is required for another assignee }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/tasks/{task}:
    parameters:
      - { in: path, name: task, required: true, schema: { type: integer, minimum: 1 } }
    patch:
      tags: [Identity]
      summary: Update a task owned by the authenticated admin
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1, maxLength: 255 }
                description: { type: string, maxLength: 10000, nullable: true }
                priority: { type: string, enum: [low, normal, high, urgent] }
                status: { type: string, enum: [todo, doing, done] }
                due_at: { type: string, format: date-time, nullable: true }
                remind_at: { type: string, format: date-time, nullable: true }
                repeat_rule: { type: string, enum: [daily, weekly], nullable: true }
                subject_type: { type: string, enum: [order, product, customer, inventory], nullable: true }
                subject_id: { type: integer, minimum: 1, nullable: true }
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalTaskEnvelope' }
        '404': { description: Task not found for this admin }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Identity]
      summary: Delete a task owned by the authenticated admin
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Task deleted }
        '404': { description: Task not found for this admin }
  /me/tasks/{task}/complete:
    parameters:
      - { in: path, name: task, required: true, schema: { type: integer, minimum: 1 } }
    post:
      tags: [Identity]
      summary: Complete an owned task
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Completed task resource
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalTaskEnvelope' }
        '404': { description: Task not found for this admin }
  /me/tasks/{task}/snooze:
    parameters:
      - { in: path, name: task, required: true, schema: { type: integer, minimum: 1 } }
    post:
      tags: [Identity]
      summary: Snooze an owned task reminder
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [duration]
              properties:
                duration: { type: string, enum: [10_minutes, 1_hour, tomorrow_morning] }
      responses:
        '200':
          description: Reminder moved to the requested time
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalTaskEnvelope' }
        '404': { description: Task not found for this admin }
        '422': { description: Invalid duration or task already completed }
  /account/privacy/exports:
    get:
      tags: [Identity]
      summary: List the authenticated account's personal data exports
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Owner-scoped export jobs containing allowlisted profile, preferences, task workspace, login/activity data; available to storefront and admin account audiences. Ready files include a signed URL that expires after seven days.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PersonalDataExport' } }
    post:
      tags: [Identity]
      summary: Queue a personal data ZIP export for the current account
      security: [{ bearerAuth: [] }]
      responses:
        '202':
          description: Export queued; the authenticated account can poll the export list for progress.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PersonalDataExport' }
                  message: { type: string }
        '429': { description: Too many active export jobs or requests. }
  /account/privacy/retention:
    get:
      tags: [Identity]
      summary: Read data retention periods for the authenticated account
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current retention periods; the activity log period is configured by an administrator and defaults to 365 days.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      login_history_days: { type: integer, example: 180 }
                      read_notifications_days: { type: integer, example: 90 }
                      activity_log_days: { type: integer, minimum: 30, maximum: 3650, example: 365 }
                      personal_exports_days: { type: integer, example: 7 }
  /account/privacy/exports/{job}/download:
    get:
      tags: [Identity]
      summary: Download an owned export using its temporary signed URL and account session
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: job, required: true, schema: { type: integer, minimum: 1 } }
        - { in: query, name: expires, required: true, schema: { type: integer } }
        - { in: query, name: signature, required: true, schema: { type: string } }
      responses:
        '200': { description: Private ZIP download, content: { application/zip: { schema: { type: string, format: binary } } } }
        '403': { description: Invalid or expired signature. }
        '404': { description: Export is not owned by this account. }
        '410': { description: Export file is not ready or has expired. }
  /account/activity:
    get:
      tags: [Identity]
      summary: List audit events created by the authenticated user
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: module, schema: { type: string, maxLength: 80 } }
        - { in: query, name: action, schema: { type: string, maxLength: 20 } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: sort, schema: { type: string, enum: [created_at, -created_at, module, -module, action, -action, path, -path, ip, -ip], default: -created_at } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Paginated personal activity log, sorted by a validated visible field and scoped to the authenticated user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        module: { type: string }
                        action: { type: string }
                        path: { type: string }
                        changes:
                          nullable: true
                          description: Audit payload; legacy rows may contain a JSON string, while newer rows can contain before/after snapshots and a redacted request payload.
                          oneOf:
                            - { type: object, additionalProperties: true }
                            - { type: string }
                        ip: { type: string, nullable: true }
                        created_at: { type: string, format: date-time }
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer }
                      last_page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
        '422': { $ref: '#/components/responses/ValidationError' }
