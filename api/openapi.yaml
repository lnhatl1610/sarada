      summary: Get an active collection and optionally include its published products
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
        - in: query
          name: include_products
          schema:
            type: boolean
            default: true
          description: "Set false when only collection metadata is needed; product listings should use GET /products?collection={slug} for filtering and pagination."
        - in: query
          name: include_lookbook_products
          schema: { type: boolean, default: false }
          description: Include only published products with configured image hotspot positions; returned separately as lookbook_products.
      responses:
        '200':
          description: Collection with its product list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/StorefrontCollection'
