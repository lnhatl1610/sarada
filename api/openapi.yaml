  /newsletter/subscriptions:
    post:
      tags: [Catalog]
      summary: Save a visitor's newsletter subscription
      description: Stores a normalized email and consent timestamp immediately after explicit consent; no email-confirmation step is required. Duplicate requests are idempotent and return the same response. Limited to five attempts per minute per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, consent]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                consent: { type: boolean, const: true }
      responses:
        '202':
          description: Subscription saved immediately (same response for an existing address)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsletterSubscriptionAccepted' }
        '422': { description: Invalid email or consent missing }
        '429': { description: Rate limit exceeded }
  /newsletter/unsubscribe-requests:
    post:
      tags: [Marketing]
      summary: Request a newsletter unsubscribe confirmation link
      description: Accepts a normalized email and reason. Always returns the same response; an email is queued only when the address has an active subscription. The one-time token is stored as a SHA-256 hash and expires after 30 minutes. Limited to five attempts per minute per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewsletterUnsubscribeRequest' }
      responses:
        '202':
          description: Neutral response that does not disclose subscription status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsletterSubscriptionAccepted' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Rate limit exceeded }
  /newsletter/unsubscribe-confirmations:
    post:
      tags: [Marketing]
      summary: Confirm newsletter unsubscribe
      description: Consumes the single-use token from the subscriber's email. Expired, unknown, or used tokens return NEWSLETTER_UNSUBSCRIBE_LINK_INVALID.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewsletterUnsubscribeConfirmation' }
      responses:
        '200':
          description: Subscription disabled and marketing eligibility withdrawn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsletterSubscriptionAccepted' }
        '422': { description: Invalid token or request body; invalid tokens use NEWSLETTER_UNSUBSCRIBE_LINK_INVALID }
        '429': { description: Rate limit exceeded }
  /contact/messages:
    post:
      tags: [Marketing]
      summary: Send a storefront contact request to the configured support email
      description: Public multipart request, limited to five attempts per minute per IP. Contact details and an optional validated image are emailed directly; the message and attachment are not persisted by this endpoint.
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/StoreContactMessageInput' }
      responses:
        '202':
          description: Contact request accepted for delivery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreContactMessageAccepted' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Rate limit exceeded }
        '503': { description: Contact email is not configured or could not be delivered }
  /stores:
    get:
      tags: [Catalog]
      summary: List published store locations
      parameters:
        - { in: query, name: province_code, schema: { type: string, maxLength: 32 } }
        - { in: query, name: ward_code, description: Filter within province_code using the current Vietnam address catalog., schema: { type: string, maxLength: 32 } }
