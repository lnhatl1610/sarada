    StorefrontNotificationChannelPreferences:
      type: object
      required: [in_app, email, sms, zalo, push]
      properties:
        in_app: { type: boolean }
        email: { type: boolean }
        sms: { type: boolean }
        zalo: { type: boolean }
        push: { type: boolean }
    StorefrontOrderItem:
      type: object
      required: [id, product_id, variant_id, product_name, variant_name, sku, image, unit_price, quantity, line_total]
      properties:
        id: { type: integer }
        product_id: { type: [integer, 'null'] }
        variant_id: { type: [integer, 'null'] }
        product_name: { type: string }
        variant_name: { type: [string, 'null'] }
        sku: { type: string }
        image: { type: [string, 'null'], format: uri }
        unit_price: { type: integer, minimum: 0 }
        quantity: { type: integer, minimum: 1 }
        line_total: { type: integer, minimum: 0 }
        review_status:
          type: [string, 'null']
          enum: [pending, approved, rejected, null]
          description: Included only in the authenticated customer's order detail; moderation notes are never exposed. Omitted from guest tracking.
    StorefrontOrderHistoryEntry:
      type: object
      required: [id, from_status, to_status, note, changed_by, created_at, updated_at]
      properties:
        id: { type: integer }
        from_status: { type: [string, 'null'] }
        to_status: { type: string }
        note: { type: [string, 'null'] }
        changed_by: { type: [integer, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StorefrontOrderShipment:
      type: object
      required: [id, carrier, tracking_code, tracking_url, status, shipped_at, delivered_at]
      properties:
        id: { type: integer }
        carrier: { type: [string, 'null'] }
        tracking_code: { type: [string, 'null'] }
        tracking_url: { type: [string, 'null'], maxLength: 2048, format: uri, description: Optional HTTPS tracking page configured by staff }
        status: { type: string }
        shipped_at: { type: [string, 'null'], format: date-time }
        delivered_at: { type: [string, 'null'], format: date-time }
    StorefrontOrderRefund:
      type: object
      required: [amount_vnd, created_at]
      properties:
        amount_vnd: { type: integer, minimum: 0, description: Integer VND refund amount }
        created_at: { type: string, format: date-time }
    ApiError:
      type: object
      properties:
        message: { type: string }
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
  responses:
    AdminOperationsList:
      description: Operational rows and pagination metadata; payment and shipment lists also return filter-aware status summaries.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: array, items: { type: object } }
              meta:
                type: object
                properties:
                  current_page: { type: integer }
                  last_page: { type: integer }
                  per_page: { type: integer }
                  total: { type: integer }
              summary:
                type: object
                description: Payment totals calculated with the same active filters as the list.
                properties:
                  success_count: { type: integer }
                  success_amount: { type: integer }
                  pending_count: { type: integer }
                  pending_amount: { type: integer }
                  failed_count: { type: integer }
                  failed_amount: { type: integer }
                  refunded_count: { type: integer }
                  refunded_amount: { type: integer }
              status_counts:
                type: object
                description: Counts for each quick filter, excluding the selected status; present for payments and shipments.
                additionalProperties: { type: integer, minimum: 0 }
    ValidationError:
      description: Input or business validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
