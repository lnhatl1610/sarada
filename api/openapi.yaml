      responses:
        '200':
          description: Notifications filtered by the current user's permissions with unread count
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, event, title, detail, priority, href, read_at, archived_at, snoozed_until, created_at]
                      properties:
                        id: { type: string, format: uuid }
                        event: { type: string, enum: [new_order, delivery_failed, low_stock, review_pending, staff_pending, task_reminder, weekly_report, admin_digest] }
                        title: { type: string }
                        detail: { type: string }
                        priority: { type: string, enum: [normal, important, urgent] }
                        href: { type: string }
                        read_at: { type: string, format: date-time, nullable: true }
                        archived_at: { type: string, format: date-time, nullable: true }
                        snoozed_until: { type: string, format: date-time, nullable: true }
                        created_at: { type: string, format: date-time }
                  meta:
                    type: object
                    required: [current_page, last_page, per_page, total, unread_count]
                    properties:
                      current_page: { type: integer }
                      last_page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
                      unread_count: { type: integer }
