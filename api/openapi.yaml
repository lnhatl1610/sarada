                          pending_orders: { type: integer, minimum: 0 }
                          delivery_failed_orders: { type: integer, minimum: 0 }
                          failed_payments: { type: integer, minimum: 0, description: Unique orders with at least one failed payment }
                          pending_reviews: { type: integer, minimum: 0 }
                          low_stock: { type: integer, minimum: 0 }
                          pending_staff_approvals: { type: integer, minimum: 0 }
                      items:
                        type: object
                        required: [pending_orders, delivery_failed_orders, failed_payments, pending_reviews, low_stock, pending_staff_approvals]
                        properties:
                          pending_orders:
                            type: array
                            maxItems: 5
                            items:
                              type: object
                              required: [id, code, customer_name, created_at]
                              properties:
                                id: { type: integer }
                                code: { type: string }
                                customer_name: { type: string }
                                created_at: { type: string, format: date-time }
                          delivery_failed_orders:
                            type: array
                            maxItems: 5
                            items:
                              type: object
                              required: [id, code, customer_name, updated_at]
                              properties:
                                id: { type: integer }
                                code: { type: string }
                                customer_name: { type: string }
                                updated_at: { type: string, format: date-time }
                          failed_payments:
                            type: array
                            maxItems: 5
                            description: One latest failed-payment timestamp per order.
                            items:
                              type: object
                              required: [id, code, customer_name, updated_at]
                              properties:
                                id: { type: integer, description: Order ID }
                                code: { type: string }
                                customer_name: { type: string }
                                updated_at: { type: string, format: date-time }
                          pending_reviews:
                            type: array
                            maxItems: 5
                            items:
                              type: object
                              required: [id, product_id, product_name, created_at]
                              properties:
                                id: { type: integer }
                                product_id: { type: integer }
                                product_name: { type: string }
                                created_at: { type: string, format: date-time }
                          low_stock:
                            type: array
                            maxItems: 5
                            items:
                              type: object
                              required: [id, sku, product_name, quantity, reserved]
                              properties:
                                id: { type: integer, description: Product variant ID }
                                sku: { type: string }
                                product_name: { type: string }
                                quantity: { type: integer }
                                reserved: { type: integer }
                          pending_staff_approvals:
                            type: array
                            maxItems: 5
                            items:
                              type: object
                              required: [id, name, email, created_at]
                              properties:
                                id: { type: integer }
                                name: { type: string }
                                email: { type: string, format: email }
                                created_at: { type: string, format: date-time }
        '401': { description: Unauthenticated }
  /admin/uploads:
    post:
