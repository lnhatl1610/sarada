  /admin/products/{product}/variants:
    post:
      tags: [Admin]
      summary: Create a variant and optional initial stock movement
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: product, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductVariantInput' }
      responses:
        '201': { description: Variant created }
  /admin/products/{product}/variants/{variant}:
    patch:
      tags: [Admin]
      summary: Update variant attributes and pricing without editing inventory
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: product, required: true, schema: { type: integer } }
        - { in: path, name: variant, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductVariantInput' }
      responses:
        '200': { description: Variant updated }
  /admin/products/{product}/images:
    post:
      tags: [Admin]
      summary: Attach an image URL to a product
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: product, required: true, schema: { type: integer } }
      responses:
        '201': { description: Image added }
  /admin/products/{product}/images/{image}:
    patch:
      tags: [Admin]
      summary: Update product image alt text, color association, or 360-degree frame role
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: product, required: true, schema: { type: integer } }
        - { in: path, name: image, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alt: { type: [string, 'null'], maxLength: 255 }
                color_value_id: { type: [integer, 'null'], description: Attribute value whose attribute type is color }
                is_360_frame: { type: boolean, description: Add this image to the ordered 360-degree frame set. }
      responses:
        '200': { description: Updated product image metadata }
        '404': { description: Image not found }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Admin]
      summary: Remove a product image
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: product, required: true, schema: { type: integer } }
        - { in: path, name: image, required: true, schema: { type: integer } }
      responses:
        '200': { description: Image removed }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Audience-scoped 15-minute signed JWT. The aud claim is admin or storefront; sid must map to an active revocable session."
  parameters:
    AdminOperationSearch:
      name: q
      in: query
      description: Searchable fields depend on the section; shipment search includes order code, tracking code, recipient name, and phone; movement search includes product, SKU, actor, and reason.
      schema: { type: string, maxLength: 120 }
    AdminOperationStatus:
      name: status
      in: query
      description: For payments, success includes legacy paid rows and refunded includes partial refunds; shipments also accept waiting, in_transit, and failed; movements filter by movement type.
      schema: { type: string }
    AdminOperationMethod:
      name: method
      in: query
      description: Payment method filter.
      schema: { type: string }
    AdminOperationCarrier:
      name: carrier
      in: query
      description: Partial carrier-name filter for shipments.
      schema: { type: string, maxLength: 120 }
    AdminOperationSort:
      name: sort
      in: query
      description: Allowlisted field; prefix with - for descending order. Supported fields depend on section.
      schema: { type: string, maxLength: 64 }
    AdminOperationFrom:
      name: from
      in: query
      schema: { type: string, format: date }
    AdminOperationTo:
      name: to
      in: query
      schema: { type: string, format: date }
    AdminOperationMinAmount:
      name: min_amount
      in: query
      description: Minimum payment amount in integer VND (payments only).
      schema: { type: integer, minimum: 0 }
    AdminOperationMaxAmount:
      name: max_amount
      in: query
      description: Maximum payment amount in integer VND (payments only).
      schema: { type: integer, minimum: 0 }
    AdminOperationInactiveHours:
      name: inactive_hours
      in: query
      description: Minimum hours since cart update before treating a cart as abandoned; defaults to 3.
      schema: { type: integer, minimum: 1, maximum: 8760 }
    AdminOperationMinValue:
      name: min_value
      in: query
      description: Minimum cart total in integer VND (carts only).
      schema: { type: integer, minimum: 0 }
    AdminOperationMaxValue:
      name: max_value
      in: query
      description: Maximum cart total in integer VND (carts only).
      schema: { type: integer, minimum: 0 }
    AdminOperationCustomerType:
      name: customer_type
      in: query
      description: Registered customer or guest cart (carts only).
      schema: { type: string, enum: [registered, guest] }
    AdminOperationWishlistView:
      name: view
      in: query
      description: Wishlist grouping (defaults to products).
      schema: { type: string, enum: [products, customers] }
    AdminOperationCategoryId:
      name: category_id
      in: query
      description: Product category filter for wishlist product view.
      schema: { type: integer, minimum: 1 }
    AdminOperationPage:
      name: page
      in: query
      schema: { type: integer, minimum: 1 }
    AdminOperationPerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100 }
  schemas:
    ProductPriceAlertListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [product_ids]
          properties:
            product_ids:
              type: array
              items: { type: integer }
    ProductPriceAlertEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [enabled, reference_price, message]
          properties:
            enabled: { type: boolean, const: true }
            reference_price: { type: integer, minimum: 0, description: Effective product price baseline in integer VND. }
            message: { type: string }
    MessageEnvelope:
      type: object
      required: [message]
      properties:
        message: { type: string }
    WishlistList:
      type: object
      required: [id, name, is_default, item_count, share_token, created_at, updated_at]
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 80 }
        is_default: { type: boolean }
        item_count: { type: integer, minimum: 0 }
        share_token: { type: [string, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
    WishlistListEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/WishlistList' }
    WishlistListCollectionEnvelope:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/WishlistList' } }
    SharedWishlistEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [name, products]
          properties:
            name: { type: string }
            products: { $ref: '#/components/schemas/StorefrontProductPageEnvelope' }
    SupportAttachment:
      type: object
      required: [index, name, mime_type, size]
      properties:
        index: { type: integer, minimum: 0 }
        name: { type: string }
        mime_type: { type: [string, 'null'] }
        size: { type: integer, minimum: 0 }
    SupportContactEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [email, phone, hours]
          properties:
            email: { type: [string, 'null'], format: email }
            phone: { type: [string, 'null'] }
            hours: { type: [string, 'null'] }
    SupportAssignee:
      type: object
      required: [id, name, email]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
    SupportAssigneesEnvelope:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/SupportAssignee' } }
    StorefrontUser:
      type: object
      required: [id, name, email, phone, avatar]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, 'null'] }
        avatar: { type: [string, 'null'], description: Avatar URL or storage path returned by the user model }
    PasskeyCredentialResponse:
      type: object
      required: [id, rawId, type, response]
      properties:
        id: { type: string, description: Base64url credential identifier }
        rawId: { type: string, description: Base64url raw credential identifier }
        type: { type: string, enum: [public-key] }
        response:
          type: object
          additionalProperties: true
          description: Browser WebAuthn attestation or assertion response; binary fields are base64url encoded.
    PasskeyChallengeEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [challenge_id, options, expires_in]
          properties:
            challenge_id: { type: string, format: uuid }
            options: { type: object, additionalProperties: true }
            expires_in: { type: integer, const: 300 }
    PasskeyLoginRequest:
      type: object
      required: [challenge_id, credential]
      properties:
        challenge_id: { type: string, format: uuid }
        credential: { $ref: '#/components/schemas/PasskeyCredentialResponse' }
    RegisterPasskeyRequest:
      type: object
      required: [challenge_id, name, credential]
      properties:
        challenge_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
        credential: { $ref: '#/components/schemas/PasskeyCredentialResponse' }
    PasskeySummary:
      type: object
      required: [id, name, last_used_at, created_at]
      properties:
        id: { type: integer }
        name: { type: string }
        last_used_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    PasskeyEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/PasskeySummary' }
    PasskeyListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PasskeySummary' }
    StorefrontLoginEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user, access_token, token_type, expires_in]
          properties:
            user: { $ref: '#/components/schemas/StorefrontUser' }
            access_token: { type: string, description: Short-lived storefront-audience JWT; keep in memory only }
            token_type: { type: string, enum: [Bearer] }
            expires_in: { type: integer, minimum: 1 }
    StorefrontRefreshEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [access_token, token_type, expires_in]
          properties:
            access_token: { type: string, description: Short-lived storefront-audience JWT; keep in memory only }
            token_type: { type: string, enum: [Bearer] }
            expires_in: { type: integer, minimum: 1 }
    StorefrontIdentityEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user, roles, permissions]
          properties:
            user: { $ref: '#/components/schemas/StorefrontUser' }
            roles: { type: array, items: { type: string } }
            permissions: { type: array, items: { type: string } }
    StorefrontRegistrationEnvelope:
      type: object
      required: [data, message]
      properties:
        data:
          type: object
          required: [email, status]
          properties:
            email: { type: string, format: email }
            status: { type: string, enum: [pending_approval] }
        message: { type: string }
    CatalogFilterOptionsEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [brands, sizes, colors, color_swatches, materials, fits, facet_counts, price_range]
          properties:
            brands:
              type: array
              items:
                type: object
                required: [name, slug, banner_alt, product_count]
                properties:
                  name: { type: string }
                  slug: { type: string }
                  logo: { type: [string, 'null'] }
                  banner: { type: [string, 'null'] }
                  banner_alt: { type: string, description: Accessible description for the brand banner }
                  description: { type: [string, 'null'], description: Short brand story }
                  meta_title: { type: [string, 'null'] }
                  meta_description: { type: [string, 'null'] }
                  product_count: { type: integer, minimum: 0 }
            sizes: { type: array, items: { type: string } }
            colors: { type: array, items: { type: string } }
            color_swatches:
              type: array
              items:
                type: object
                required: [value, color_hex]
                properties:
                  value: { type: string }
                  color_hex: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$' }
            materials: { type: array, items: { type: string } }
            fits: { type: array, items: { type: string } }
            facet_counts:
              type: object
              required: [brands, sizes, colors, materials, fits]
              properties:
                brands: { type: object, additionalProperties: { type: integer, minimum: 0 } }
                sizes: { type: object, additionalProperties: { type: integer, minimum: 0 } }
                colors: { type: object, additionalProperties: { type: integer, minimum: 0 } }
                materials: { type: object, additionalProperties: { type: integer, minimum: 0 } }
                fits: { type: object, additionalProperties: { type: integer, minimum: 0 } }
            price_range:
              type: object
              required: [min, max]
              properties:
                min: { type: [integer, 'null'], minimum: 0, description: Lowest active-variant effective price across published products, in integer VND }
                max: { type: [integer, 'null'], minimum: 0, description: Highest active-variant effective price across published products, in integer VND }
    StorefrontConfigurationEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [public_registration_enabled, maintenance_enabled, maintenance_message, maintenance_expected_until, store_name, store_logo, store_email, store_phone, store_address, business_hours, support_email, support_phone, support_hours, contact_form_enabled, sms_stock_alerts_enabled, newsletter_welcome_offer_enabled, seo_title, seo_description, seo_og_image, seo_analytics_id, store_favicon, social_facebook, social_instagram, social_tiktok, social_zalo, social_zalo_oa_id, payment_cod_enabled, payment_bank_transfer_enabled, free_shipping_threshold, home_sections, instagram_posts, password_policy]
          properties:
            public_registration_enabled: { type: boolean }
            maintenance_enabled: { type: boolean }
            maintenance_message: { type: string }
            maintenance_expected_until: { type: [string, 'null'], format: date-time }
            store_name: { type: string, maxLength: 120 }
            store_logo: { type: string, description: Empty string when no public logo is configured }
            store_email: { type: string, description: Empty string when no store email is configured }
            store_phone: { type: string, description: Empty string when no store phone is configured }
            store_address: { type: string, description: Empty string when no store address is configured }
            business_hours: { type: string, description: Empty string when business hours are not configured }
            support_email: { type: string, description: Public support email address, empty when not configured }
            support_phone: { type: string, description: Public support phone number, empty when not configured }
            support_hours: { type: string, description: Public support hours, empty when not configured }
            contact_form_enabled: { type: boolean, description: True when a support or store email is configured to receive contact requests }
            sms_stock_alerts_enabled: { type: boolean, description: True only when all Twilio SMS credentials are configured for back-in-stock alerts }
            newsletter_welcome_offer_enabled: { type: boolean, description: True only when the configured welcome coupon is active, within its date window, and has remaining uses; the coupon code is never exposed here. }
            seo_title: { type: string }
            seo_description: { type: string }
            seo_og_image: { type: string, description: Empty string when no image is configured }
            seo_analytics_id: { type: string, pattern: '^(G-[A-Za-z0-9]{6,20})?$', description: Public Google Analytics 4 measurement ID; empty when analytics is not configured. The storefront loads it only after analytics consent. }
            store_favicon: { type: string, description: Empty string when no favicon is configured }
            social_zalo_oa_id: { type: string, description: Empty string when the official Zalo share plugin is not configured }
            social_facebook: { type: string, description: Empty string when no Facebook page is configured }
            social_instagram: { type: string, description: Empty string when no Instagram page is configured }
            social_tiktok: { type: string, description: Empty string when no TikTok page is configured }
            social_zalo: { type: string, description: Empty string when no Zalo link is configured }
            payment_cod_enabled: { type: boolean }
            payment_bank_transfer_enabled: { type: boolean, description: True only if transfer is enabled and the bank BIN, name, account, and holder are configured. }
            free_shipping_threshold: { type: integer, minimum: 0, description: Configured store-wide free-shipping threshold in integer VND; province-specific values are returned by GET /shipping/fee }
            home_sections: { type: array, minItems: 13, maxItems: 13, items: { $ref: '#/components/schemas/StorefrontHomeSectionSetting' }, description: Store-configured order and visibility of homepage content sections. }
            instagram_posts: { type: array, maxItems: 6, items: { $ref: '#/components/schemas/StorefrontInstagramPost' }, description: Manually curated public Instagram post thumbnails; empty until configured. }
            password_policy:
              type: object
              required: [min_length, require_letter, require_number, require_special]
              properties:
                min_length: { type: integer, minimum: 8, maximum: 64 }
                require_letter: { type: boolean }
                require_number: { type: boolean }
                require_special: { type: boolean }
    StorefrontHomeSectionSetting:
      type: object
      required: [key, enabled]
      properties:
        key: { type: string, enum: [hero, categories, new_arrivals, campaign, best_sellers, recently_viewed, personalized, collections, service_strip, lookbook, newsletter, membership, instagram] }
        enabled: { type: boolean }
    StorefrontInstagramPost:
      type: object
      required: [post_url, image_url, alt]
      properties:
        post_url: { type: string, format: uri, pattern: '^https://(www\.)?instagram\.com/(p|reel|tv)/[A-Za-z0-9_-]+/?(?:\?.*)?$', maxLength: 500 }
        image_url: { type: string, format: uri, pattern: '^https?://', maxLength: 500 }
        alt: { type: string, minLength: 1, maxLength: 180 }
    StorefrontPlacedOrder:
      type: object
      required: [code, status, fulfillment_type, pickup_location, payment_status, payment_method, payment_access_token, invoice_requested, subtotal, discount_total, membership_points_used, membership_discount_total, shipping_fee, shipping_method, grand_total, placed_at, items]
      properties:
        code: { type: string }
        status: { type: string }
        fulfillment_type: { type: string, enum: [delivery, pickup] }
        pickup_location: { anyOf: [{ $ref: '#/components/schemas/PickupLocationSnapshot' }, { type: 'null' }] }
        payment_status: { type: string }
        payment_method: { type: string, enum: [cod, bank_transfer] }
        payment_access_token: { type: [string, 'null'], description: Scoped capability required by the bank transfer instruction endpoint; only present for an unpaid bank transfer order. }
        invoice_requested: { type: boolean, description: Whether the customer requested a VAT invoice for this order. }
        subtotal: { type: integer, minimum: 0, description: Integer VND }
        discount_total: { type: integer, minimum: 0, description: Integer VND }
        membership_points_used: { type: integer, minimum: 0 }
        membership_discount_total: { type: integer, minimum: 0, description: Integer VND discount from redeemed points }
        shipping_fee: { type: integer, minimum: 0, description: Integer VND }
        shipping_method: { type: [object, 'null'], required: [id, name, est_days], properties: { id: { type: integer }, name: { type: string }, est_days: { type: [string, 'null'], description: Expected delivery time as configured by staff } } }
        grand_total: { type: integer, minimum: 0, description: Integer VND }
        placed_at: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            required: [product_name, product_slug, quantity, unit_price, line_total]
            properties:
              product_name: { type: string }
              product_slug: { type: [string, 'null'], description: Current catalog slug when the product still exists, otherwise null; used only to load post-purchase recommendations. }
              variant_name: { type: [string, 'null'] }
              image: { type: [string, 'null'] }
              quantity: { type: integer, minimum: 1 }
              unit_price: { type: integer, minimum: 0, description: Integer VND }
              line_total: { type: integer, minimum: 0, description: Integer VND }
    StorefrontPlacedOrderEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/StorefrontPlacedOrder' }
    BankTransferInstructionsEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/BankTransferInstructions' }
    BankTransferInstructions:
      type: object
      required: [code, payment_status, amount, placed_at, expires_at, bank]
      properties:
        code: { type: string }
        payment_status: { type: string, enum: [unpaid, paid, failed, refunded] }
        amount: { type: integer, minimum: 0, description: Integer VND }
        placed_at: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time, description: Null when unpaid-order expiry is disabled. }
        bank:
          type: object
          required: [bin, name, account, holder, note, transfer_content]
          properties:
            bin: { type: string, pattern: '^\d{6}$' }
            name: { type: string }
            account: { type: string }
            holder: { type: string }
            note: { type: string }
            transfer_content: { type: string, description: Order-specific alphanumeric bank-transfer reference. }
    CheckoutQuote:
      type: object
      required: [fulfillment_type, pickup_location_id, items, subtotal, discount_total, coupon_discount_total, membership_points_balance, membership_points_used, membership_discount_total, shipping_fee, shipping_method, shipping_methods, grand_total, coupon_id, coupon_code]
      properties:
        fulfillment_type: { type: string, enum: [delivery, pickup] }
        pickup_location_id: { type: [integer, 'null'] }
        items:
          type: array
          items:
            type: object
            required: [variant_id, sku, quantity, unit_price, line_total]
            properties:
              variant_id: { type: integer }
              sku: { type: string }
              quantity: { type: integer }
              unit_price: { type: integer, minimum: 0 }
              line_total: { type: integer, minimum: 0 }
        subtotal: { type: integer, minimum: 0 }
        discount_total: { type: integer, minimum: 0 }
        coupon_discount_total: { type: integer, minimum: 0 }
        membership_points_balance: { type: integer, minimum: 0 }
        membership_points_used: { type: integer, minimum: 0 }
        membership_discount_total: { type: integer, minimum: 0 }
        shipping_fee: { type: integer, minimum: 0 }
        shipping_method: { type: [object, 'null'], required: [id, name, est_days], properties: { id: { type: integer }, name: { type: string }, est_days: { type: [string, 'null'] } } }
        shipping_methods:
          type: array
          items: { type: object, required: [id, name, fee, est_days], properties: { id: { type: [integer, 'null'] }, name: { type: string }, fee: { type: integer, minimum: 0, description: Integer VND after threshold and coupon rules }, est_days: { type: [string, 'null'], description: Expected delivery time as configured by staff } } }
        grand_total: { type: integer, minimum: 0 }
        coupon_id: { type: [integer, 'null'] }
        coupon_code: { type: [string, 'null'] }
    PickupLocation:
      type: object
      required: [id, name, address, province_name, ward_name, phone, opening_hours]
      properties:
        id: { type: integer }
        name: { type: string }
        address: { type: string }
        province_name: { type: string }
        ward_name: { type: [string, 'null'] }
        phone: { type: string }
        opening_hours: { type: string }
    PickupLocationSnapshot:
      allOf: [{ $ref: '#/components/schemas/PickupLocation' }]
    PickupLocationsEnvelope:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/PickupLocation' } }
    CheckoutQuoteEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/CheckoutQuote' }
    ShippingFee:
      type: object
      required: [province_code, fee, free_shipping_threshold, shipping_methods]
      properties:
        province_code: { type: string }
        fee: { type: integer, minimum: 0, description: Integer VND }
        free_shipping_threshold: { type: [integer, 'null'], minimum: 0, description: Integer VND; null disables free shipping }
        shipping_methods:
          type: array
          description: Province fallback plus active configured methods eligible for the optional ward. Fees are base informational amounts before cart thresholds or coupons.
          items:
            type: object
            required: [id, name, fee, est_days]
            properties:
              id: { type: [integer, 'null'], description: Null identifies the province-rate fallback. }
              name: { type: string }
              fee: { type: integer, minimum: 0, description: Integer VND base fee }
              est_days: { type: [string, 'null'], description: Staff-configured delivery estimate; null means none is published. }
    ShippingFeeEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ShippingFee' }
    AvailableCoupon:
      type: object
      required: [id, code, description, type, value, max_discount, min_order_value, ends_at, eligible, unavailable_reason]
      properties:
        id: { type: integer }
        code: { type: string }
        description: { type: [string, 'null'] }
        type: { type: string, enum: [percent, fixed, free_ship] }
        value: { type: integer, minimum: 0 }
        max_discount: { type: [integer, 'null'], minimum: 0 }
        min_order_value: { type: integer, minimum: 0, description: Integer VND }
        ends_at: { type: [string, 'null'], format: date-time }
        eligible: { type: boolean }
        unavailable_reason: { type: [string, 'null'] }
    AvailableCouponsEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AvailableCoupon' }
    CartProductSummary:
      type: object
      required: [id, name, slug, image, image_alt, sku, size, color, variants]
      properties:
        id: { type: [integer, 'null'] }
        name: { type: [string, 'null'] }
        slug: { type: [string, 'null'] }
        image: { type: [string, 'null'], format: uri }
        image_alt: { type: [string, 'null'], description: Accessible description from the selected product image }
        sku: { type: [string, 'null'] }
        size: { type: [string, 'null'] }
        color: { type: [string, 'null'] }
        variants:
          type: array
          items: { $ref: '#/components/schemas/CartVariantOption' }
    CartVariantOption:
      type: object
      required: [id, sku, size, color, unit_price, available_quantity]
      properties:
        id: { type: integer }
        sku: { type: [string, 'null'] }
        size: { type: [string, 'null'] }
        color: { type: [string, 'null'] }
        unit_price: { type: integer, minimum: 0, description: Current server-calculated integer VND price }
        available_quantity: { type: integer, minimum: 0 }
    CartItem:
      type: object
      required: [id, variant_id, quantity, unit_price, available_quantity, product, line_total]
      properties:
        id: { type: integer }
        variant_id: { type: integer }
        quantity: { type: integer, minimum: 1 }
        unit_price: { type: integer, minimum: 0 }
        available_quantity: { type: integer, minimum: 0 }
        product: { $ref: '#/components/schemas/CartProductSummary' }
        line_total: { type: integer, minimum: 0 }
    StorefrontCart:
      type: object
      required: [id, session_token, recovery_email, was_expired, items]
      properties:
        id: { type: integer }
        session_token: { type: [string, 'null'] }
        recovery_email: { type: [string, 'null'], format: email, description: Guest reminder address when explicit consent is active }
