        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Public API rate limit exceeded }
  /search/pages:
    get:
      tags: [Catalog]
      summary: Search published content pages and blog articles
      description: Returns paginated published CMS pages and currently visible blog articles matching the query in title, slug, description, excerpt, or content. Drafts and future scheduled articles are never returned.
      parameters:
        - { in: query, name: q, required: true, schema: { type: string, minLength: 2, maxLength: 120 } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 20, default: 20 } }
      responses:
        '200':
          description: Matching published pages and articles with pagination metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorefrontSearchPageResultsEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Public API rate limit exceeded }
  /search/trending:
    get:
      tags: [Catalog]
      summary: List frequently submitted product search terms
      responses:
        '200':
          description: Up to eight anonymous product-matching terms from the last seven days with at least three submissions each
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrendingSearchTermsEnvelope' }
        '429': { description: Public API rate limit exceeded }
  /search/terms:
    post:
      tags: [Catalog]
      summary: Record an anonymous product search submission for trend aggregation
      description: Counts only terms that match a published product name, SKU, brand, category, color, or variant SKU and are not email, URL, or phone-like input. The API stores no user ID or IP and removes daily aggregates after 30 days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [q]
              properties:
                q: { type: string, minLength: 2, maxLength: 120 }
      responses:
        '202':
          description: Accepted whether or not the query was eligible for trend aggregation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchTermTrackEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Search submission rate limit exceeded }
  /products:
    get:
      tags: [Catalog]
      summary: Search and filter published products
      description: Search matches published product name, SKU, description, brand, category, and active variant data. If no exact text match exists, the API adds bounded near-spelling matches for longer query words.
      parameters:
        - { in: query, name: category, description: "Filter by category slug; includes products assigned to active descendant categories. The reserved hang-moi slug returns products marked as new arrivals.", schema: { type: string } }
        - { in: query, name: target_gender, description: Filter by the product's configured target audience; used by the storefront's men's and women's best-seller tabs., schema: { type: string, enum: [men, women, unisex, kids] } }
        - { in: query, name: brand, schema: { type: string } }
        - { in: query, name: collection, schema: { type: string } }
        - { in: query, name: price_min, schema: { type: integer, minimum: 0 } }
        - { in: query, name: price_max, description: Must be greater than or equal to price_min when both are supplied., schema: { type: integer, minimum: 0 } }
        - { in: query, name: size, schema: { type: string } }
        - { in: query, name: color, schema: { type: string } }
        - { in: query, name: material, description: Match an exact material value currently used by a published product., schema: { type: string, maxLength: 255 } }
        - { in: query, name: fit, description: Match an exact product fit/style value currently used by a published product., schema: { type: string, maxLength: 80 } }
        - { in: query, name: in_stock, description: "true returns products with an active variant whose available quantity (quantity minus reserved) is positive; false returns products with no such variant.", schema: { type: boolean } }
        - { in: query, name: rating_min, description: Minimum average rating from approved product reviews; products without approved reviews are excluded., schema: { type: integer, minimum: 1, maximum: 5 } }
        - { in: query, name: discount_min, description: Minimum discount percentage on at least one active variant whose product sale window is currently active., schema: { type: integer, enum: [10, 20, 30, 50] } }
        - { in: query, name: q, schema: { type: string, maxLength: 120 } }
        - { in: query, name: sort, description: "Both price sorts use the product card price: the lowest effective price among active variants. price_asc orders low to high; price_desc orders high to low. Effective prices respect the sale window. rating_desc ranks products with approved ratings first; discount_desc ranks by the largest active variant discount amount.", schema: { type: string, enum: [relevance, newest, price_asc, price_desc, bestseller, rating_desc, discount_desc] } }
        - { in: query, name: new, schema: { type: boolean } }
        - { in: query, name: best_seller, schema: { type: boolean } }
        - { in: query, name: sale, description: Return products with an active variant discount inside its configured sale window., schema: { type: boolean } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 48 } }
      responses:
        '200':
          description: Paginated products
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorefrontProductPageEnvelope' }
        '429': { description: Public API rate limit exceeded }
        '422': { $ref: '#/components/responses/ValidationError' }
  /products/{slug}:
    get:
      tags: [Catalog]
      summary: Get published product detail
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { description: Public API rate limit exceeded }
  /products/{slug}/stock-alerts:
    post:
      tags: [Catalog]
      summary: Request one email or SMS when a sold-out product variant is available again
      description: Stores one normalized contact address per variant. Phone alerts are accepted only when the Twilio SMS provider is configured. A queued notification is sent after inventory changes from unavailable to available. Limited to five attempts per minute per client IP.
      security: []
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variant_id]
              properties:
                variant_id: { type: integer, minimum: 1 }
                email: { type: string, format: email, maxLength: 254, description: Provide exactly one of email or phone. }
                phone: { type: string, pattern: '^(0|\+84)\d{9}$', maxLength: 16, description: Vietnamese phone number; requires configured SMS alerts. }
              oneOf:
                - required: [email]
                  not: { required: [phone] }
                - required: [phone]
                  not: { required: [email] }
      responses:
        '202':
          description: Stock alert registered
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [message]
                    properties:
                      message: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Public API rate limit exceeded }
  /products/{slug}/related:
    get:
      tags: [Catalog]
      summary: Get related products
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
      responses:
        '200':
          description: Published related products with active variant availability for optional outfit selection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorefrontRelatedProductsEnvelope' }
        '429': { description: Public API rate limit exceeded }
  /products/{slug}/reviews:
    get:
      tags: [Catalog]
      summary: List approved reviews for a product
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: sort, description: Order approved reviews while keeping pagination on the server., schema: { type: string, enum: [latest, rating_desc, rating_asc], default: latest } }
        - { in: query, name: rating, description: Keep reviews with this exact star rating., schema: { type: integer, minimum: 1, maximum: 5 } }
        - { in: query, name: with_images, description: Keep only reviews with at least one approved image., schema: { type: boolean, default: false } }
        - { in: query, name: size, description: Keep reviews attached to an order item with this purchased size., schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: Paginated approved reviews
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorefrontReviewPage' }
        '422': { description: Invalid page, sort, rating, image, or size filter }
        '429': { description: Public API rate limit exceeded }
  /products/{slug}/questions:
    parameters:
      - { in: path, name: slug, required: true, schema: { type: string } }
    get:
      tags: [Catalog]
      summary: List answered questions for a published product
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Paginated answered questions only, content: { application/json: { schema: { $ref: '#/components/schemas/StorefrontProductQuestionPage' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Reviews]
      summary: Submit a product question as an authenticated Storefront customer
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StorefrontProductQuestionInput' }
      responses:
        '201': { description: Question submitted privately for staff response, content: { application/json: { schema: { $ref: '#/components/schemas/StorefrontProductQuestionCreatedEnvelope' } } } }
        '401': { description: Storefront authentication required }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Question submissions are limited per client }
  /reviews/{review}/helpful-votes:
    post:
      tags: [Reviews]
      summary: Mark an approved product review as helpful
      description: One positive vote per browser visitor identifier and review; duplicate submissions are idempotent. Limited to ten attempts per minute per client IP.
      security: []
      parameters:
        - { in: path, name: review, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitor_id]
              properties:
                visitor_id: { type: string, format: uuid, description: Random browser identifier, not an authentication credential. }
      responses:
        '200':
          description: Idempotent helpful vote result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewHelpfulVoteEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Public API rate limit exceeded }
  /reviews:
    get:
      tags: [Reviews]
      summary: List recent approved reviews for published products
      description: Public, paginated review excerpts for storefront editorial sections. The public Storefront review resource never returns customer email.
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: per_page, description: Page size, capped at 10; storefront Home requests three reviews., schema: { type: integer, minimum: 1, maximum: 10, default: 3 } }
      responses:
        '200':
          description: Recent approved reviews attached to published products.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorefrontReviewPage' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Public API rate limit exceeded }
    post:
      tags: [Reviews]
      summary: Submit a review for an item from a delivered order
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/StorefrontReviewInput' }
      responses:
        '201':
          description: Review submitted for moderation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorefrontReviewEnvelope' }
        '429': { description: Authenticated upload rate limit exceeded }
        '422': { description: Order item is not eligible or was already reviewed }
  /admin/reviews:
    get:
      tags: [Admin]
      summary: List reviews for moderation
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [pending, approved, rejected] } }
        - { in: query, name: q, schema: { type: string, maxLength: 120 } }
        - { in: query, name: rating, schema: { type: integer, minimum: 1, maximum: 5 } }
        - { in: query, name: has_images, schema: { type: boolean } }
        - { in: query, name: verified_purchase, schema: { type: boolean } }
        - { in: query, name: fit, schema: { type: string, enum: [small, true_to_size, large] } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: sort, description: Sort by a visible review column; prefix with - for descending order. Defaults to -created_at., schema: { type: string, enum: [created_at, -created_at, rating, -rating, title, -title, content, -content, product_name, -product_name, customer_name, -customer_name, images_count, -images_count, media_count, -media_count, verified_purchase, -verified_purchase, status, -status] } }
      responses:
        '200':
          description: Paginated reviews with status counts calculated from active search and detail filters, excluding selected review status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: object, additionalProperties: true } }
                  meta: { type: object }
                  status_counts:
                    type: object
                    required: [pending, approved, rejected]
                    properties:
                      pending: { type: integer, minimum: 0 }
                      approved: { type: integer, minimum: 0 }
                      rejected: { type: integer, minimum: 0 }
  /admin/product-questions:
    get:
      tags: [Admin]
      summary: List product questions for moderation; requires reviews.moderate
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [pending, answered, hidden], default: pending } }
        - { in: query, name: q, schema: { type: string, maxLength: 160 } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: per_page, schema: { type: integer, enum: [10, 20, 50, 100], default: 20 } }
      responses:
        '200': { description: Paginated customer product questions, content: { application/json: { schema: { $ref: '#/components/schemas/AdminProductQuestionPage' } } } }
        '403': { description: reviews.moderate permission is required }
  /admin/product-questions/{question}:
    patch:
      tags: [Admin]
      summary: Answer, hide, or return a product question to pending; requires reviews.moderate
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: question, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminProductQuestionDecisionInput' }
      responses:
        '200': { description: Moderated question, content: { application/json: { schema: { $ref: '#/components/schemas/AdminProductQuestionEnvelope' } } } }
        '403': { description: reviews.moderate permission is required }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/reviews/{review}:
    get:
      tags: [Admin]
      summary: Show review details with images and order item
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: review, required: true, schema: { type: integer } }
      responses:
        '200': { description: Review detail }
    patch:
      tags: [Admin]
      summary: Approve or reject a review
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: review, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [approved, rejected] }
                reason: { type: string, minLength: 3, maxLength: 1000, description: Required when status is rejected }
      responses:
        '200': { description: Review moderation result }
    delete:
      tags: [Admin]
      summary: Delete a review and its attached images
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: review, required: true, schema: { type: integer } }
      responses:
        '200': { description: Review deleted and product rating recalculated }
  /admin/reviews/{review}/response:
    patch:
      tags: [Admin]
      summary: Save or clear the public store response to an approved review
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: review, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response: { type: [string, 'null'], maxLength: 1000, description: Null or empty text clears the public response. }
      responses:
        '200': { description: Store response saved and review returned }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/reviews/bulk-status:
    patch:
      tags: [Admin]
      summary: Approve or reject multiple reviews
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [review_ids, status]
              properties:
                review_ids: { type: array, minItems: 1, maxItems: 100, items: { type: integer } }
                status: { type: string, enum: [approved, rejected] }
                reason: { type: string, minLength: 3, maxLength: 1000, description: Required when status is rejected }
      responses:
        '200': { description: Bulk moderation result }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/reviews/{review}/status:
    patch:
      tags: [Admin]
      summary: Approve or reject a review using the status alias
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: review, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: string, enum: [approved, rejected] }, reason: { type: string, minLength: 3, maxLength: 1000, description: Required when status is rejected } } }
      responses:
        '200': { description: Review moderation result }
  /cart:
    get:
      tags: [Cart]
      summary: Get guest or signed-in cart
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - { in: header, name: X-Cart-Token, schema: { type: string } }
      responses:
        '200':
          description: Current cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartEnvelope' }
        '429': { description: Public API rate limit exceeded }
  /cart/recovery-contact:
    put:
      tags: [Cart]
      summary: Save a guest cart recovery email with explicit consent
      description: Available to guests only. The email is used for one-hour and 24-hour reminders while the cart remains non-empty and active. Cart token is an identifier, not an authentication credential.
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - { in: header, name: X-Cart-Token, required: true, schema: { type: string, maxLength: 120 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, consent]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                consent: { type: boolean, enum: [true], description: Explicit agreement to receive cart recovery emails }
      responses:
        '200': { description: Updated guest cart, content: { application/json: { schema: { $ref: '#/components/schemas/CartEnvelope' } } } }
        '403': { description: Authenticated customers cannot set guest recovery contact }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Public API rate limit exceeded }
    delete:
      tags: [Cart]
      summary: Withdraw guest cart recovery consent
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - { in: header, name: X-Cart-Token, required: true, schema: { type: string, maxLength: 120 } }
      responses:
        '200': { description: Updated guest cart, content: { application/json: { schema: { $ref: '#/components/schemas/CartEnvelope' } } } }
        '403': { description: Authenticated customers cannot change guest recovery contact }
        '429': { description: Public API rate limit exceeded }
  /cart/merge:
    post:
      tags: [Cart]
      summary: Merge a guest cart into the authenticated storefront customer's cart
      description: Combines matching variant lines, caps quantities to current available inventory, removes the guest cart, and returns the canonical authenticated cart.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartMergeInput' }
      responses:
        '200': { description: Canonical authenticated cart after merge, content: { application/json: { schema: { $ref: '#/components/schemas/CartEnvelope' } } } }
        '401': { description: Missing or expired storefront access token }
        '422': { $ref: '#/components/responses/ValidationError' }
  /cart/items:
    post:
      tags: [Cart]
      summary: Add a variant to the cart
      description: Adds to the existing line atomically; the combined quantity for a variant cannot exceed 20 or current available stock.
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - { in: header, name: X-Cart-Token, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variant_id, quantity]
              properties:
                variant_id: { type: integer }
                quantity: { type: integer, minimum: 1, maximum: 20 }
      responses:
        '201': { description: Updated cart, content: { application/json: { schema: { $ref: '#/components/schemas/CartEnvelope' } } } }
        '429': { description: Public API rate limit exceeded }
        '422': { $ref: '#/components/responses/ValidationError' }
  /cart/items/{item}:
    patch:
      tags: [Cart]
      summary: Change cart item quantity or select another variant of the same product
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - { in: path, name: item, required: true, schema: { type: integer } }
        - { in: header, name: X-Cart-Token, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1, maximum: 20 }
                variant_id: { type: integer, minimum: 1, description: Optional replacement variant belonging to the current product; inventory and price are recalculated server-side }
      responses:
        '200': { description: Updated cart, content: { application/json: { schema: { $ref: '#/components/schemas/CartEnvelope' } } } }
        '429': { description: Public API rate limit exceeded }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Cart]
      summary: Remove cart item
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - { in: path, name: item, required: true, schema: { type: integer } }
        - { in: header, name: X-Cart-Token, schema: { type: string } }
      responses:
        '200': { description: Updated cart, content: { application/json: { schema: { $ref: '#/components/schemas/CartEnvelope' } } } }
        '429': { description: Public API rate limit exceeded }
  /locations/provinces:
    get:
      tags: [Checkout]
      summary: List current Vietnamese provinces
      description: Uses the official, date-stamped two-level administrative catalog bundled with the application.
      responses:
        '200':
          description: Province options and catalog source metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationProvincesEnvelope' }
        '429': { description: Public API rate limit exceeded }
  /locations/provinces/{provinceCode}/wards:
    get:
      tags: [Checkout]
      summary: List communes and wards in a province
      parameters:
        - { in: path, name: provinceCode, required: true, schema: { type: string } }
      responses:
        '200':
          description: Commune/ward options for the selected province
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationWardsEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { description: Public API rate limit exceeded }
  /shipping/fee:
    get:
      tags: [Checkout]
      summary: Return informational shipping rates and eligible methods for a destination
      parameters:
        - { in: query, name: province_code, required: true, schema: { type: string } }
        - { in: query, name: ward_code, required: false, schema: { type: string }, description: Optional commune/ward code; when supplied, methods limited to that ward are included only if eligible. }
      responses:
        '200':
          description: Province fallback fee, free-shipping threshold, and active delivery methods eligible for the destination. Fees are informational; checkout computes the final fee using cart subtotal and coupons.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShippingFeeEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Public API rate limit exceeded }
  /coupons/available:
    get:
      tags: [Checkout]
      summary: List active coupons and explain whether the current cart can use each one
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - { in: header, name: X-Cart-Token, schema: { type: string } }
      responses:
        '200':
          description: Active coupon offers evaluated against the canonical cart subtotal and authenticated customer's usage limits
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailableCouponsEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Public API rate limit exceeded }
  /checkout/pickup-locations:
    get:
      tags: [Checkout]
      summary: List active stores that can fulfill every current cart line from branch stock
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - { in: header, name: X-Cart-Token, schema: { type: string } }
      responses:
        '200': { description: Pickup locations with sufficient branch stock, content: { application/json: { schema: { $ref: '#/components/schemas/PickupLocationsEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /checkout/preview:
    post:
      tags: [Checkout]
      summary: Recalculate checkout totals, membership points, and area-eligible shipping options from current catalog and inventory
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - { in: header, name: X-Cart-Token, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fulfillment_type]
              properties:
                fulfillment_type: { type: string, enum: [delivery, pickup], default: delivery }
                pickup_location_id: { type: integer, minimum: 1, description: Required for pickup; branch stock is rechecked when placing the order. }
                province_code: { type: string, description: Required for delivery. }
                ward_code: { type: [string, 'null'], maxLength: 32, description: When provided, includes shipping methods limited to that ward. }
                coupon_code: { type: [string, 'null'] }
                shipping_method_id: { type: [integer, 'null'], minimum: 1, description: Omit or send null to use province-based shipping; otherwise select an active configured method. }
                use_points: { type: boolean, default: false, description: Redeem available authenticated-customer points against the merchandise subtotal after coupon discount. }
      responses:
        '200':
          description: Recalculated quote using current prices, inventory, the province-based rate or an active configured shipping method eligible for delivery, and coupon rules. Pickup quotes use zero shipping fee and branch-specific stock.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutQuoteEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Public API rate limit exceeded }
  /orders/{code}/payment-instructions:
