                  items:
                    type: object
                    required: [size_value_id, height_min_cm, height_max_cm, weight_min_kg, weight_max_kg]
                    properties:
                      size_value_id: { type: integer }
                      height_min_cm: { type: number, minimum: 50, maximum: 250 }
                      height_max_cm: { type: number, minimum: 50, maximum: 250 }
                      weight_min_kg: { type: number, minimum: 10, maximum: 300 }
                      weight_max_kg: { type: number, minimum: 10, maximum: 300 }
      responses:
        '200': { description: Updated product size recommendations }
