        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: export, description: Stream all matching records as CSV., schema: { type: boolean, default: false } }
        - { in: query, name: sort, schema: { type: string, enum: [created_at, -created_at, user_name, -user_name, module, -module, action, -action, path, -path, ip, -ip], default: -created_at } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Paginated activity records or CSV export matching the supplied filters
          content:
            text/csv: { schema: { type: string, format: binary } }
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, module, action, path, created_at]
                      properties:
                        id: { type: integer }
                        user_name: { type: [string, 'null'] }
                        module: { type: string }
                        action: { type: string }
                        path: { type: string }
                        changes: { type: [string, 'null'], description: JSON serialized redacted before/after snapshots. }
                        ip: { type: [string, 'null'] }
                        created_at: { type: string, format: date-time }
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer }
                      last_page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
                      status_counts:
                        type: object
                        required: [all, active, blocked, pending, invited]
                        properties:
                          all: { type: integer, minimum: 0 }
                          active: { type: integer, minimum: 0 }
                          blocked: { type: integer, minimum: 0 }
                          pending: { type: integer, minimum: 0 }
                          invited: { type: integer, minimum: 0 }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/staff/roles:
    get:
      tags: [Admin]
      summary: List available staff roles and permissions
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Role presets, assigned staff counts, and their permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/StaffRole' } }
                  permissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }
  /admin/staff/invitations:
    get:
      tags: [Admin]
      summary: List pending staff invitations
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 100 } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: sort, schema: { type: string, enum: [email, -email, expires_at, -expires_at, created_at, -created_at], default: -created_at } }
      responses:
        '200':
          description: Paginated pending invitations with expiry, inviter, role, and status
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, email, role, expires_at, expired, created_at]
                      properties:
                        id: { type: integer }
                        email: { type: string, format: email }
                        role: { type: string }
                        invited_by: { type: [string, 'null'] }
                        message: { type: [string, 'null'] }
                        expires_at: { type: string, format: date-time }
                        expired: { type: boolean }
                        created_at: { type: string, format: date-time }
                  meta: { type: object, required: [current_page, last_page, per_page, total], properties: { current_page: { type: integer }, last_page: { type: integer }, per_page: { type: integer }, total: { type: integer } } }
    post:
      tags: [Admin]
      summary: Create and email a one-time staff invitation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email, role, expires_in_hours], properties: { email: { type: string, format: email }, role: { type: string, enum: [admin, sales_manager, warehouse_staff, customer_service, content_editor, accountant, staff] }, expires_in_hours: { type: integer, enum: [24, 48, 168] }, message: { type: string, maxLength: 1000 } } }
      responses:
        '201': { description: Invitation created and emailed }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/staff/invitations/{invitation}/resend:
    post:
      tags: [Admin]
      summary: Rotate invitation token and send a new link
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: invitation, required: true, schema: { type: integer } }]
      responses:
        '200': { description: New one-time invitation link emailed }
  /admin/staff/invitations/{invitation}:
    delete:
      tags: [Admin]
      summary: Revoke a pending invitation
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: invitation, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Invitation revoked }
  /admin/staff/pending-approvals:
    get:
      tags: [Admin]
      summary: List email-verified registrations awaiting owner approval
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 100 } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: sort, schema: { type: string, enum: [name, -name, email, -email, created_at, -created_at], default: -created_at } }
      responses:
        '200':
          description: Paginated email-verified registration requests
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name, email, email_verified_at, created_at]
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        email: { type: string, format: email }
                        phone: { type: [string, 'null'] }
                        role: { type: [string, 'null'] }
                        email_verified_at: { type: string, format: date-time }
                        created_at: { type: string, format: date-time }
                  meta: { type: object, required: [current_page, last_page, per_page, total], properties: { current_page: { type: integer }, last_page: { type: integer }, per_page: { type: integer }, total: { type: integer } } }
  /admin/staff/pending-approvals/{user}/approve:
    post:
      tags: [Admin]
      summary: Approve a verified registration and assign a role
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: user, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [role], properties: { role: { type: string, enum: [customer, admin, sales_manager, warehouse_staff, customer_service, content_editor, accountant, staff] } } }
      responses:
        '200': { description: Account activated and approval email sent }
        '403': { description: Only store owner can assign admin role }
  /admin/staff/pending-approvals/{user}/reject:
    post:
      tags: [Admin]
      summary: Reject a pending registration and send an email notice
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: user, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Registration rejected }
  /admin/staff/roles/{role}:
    patch:
      tags: [Admin]
      summary: Update permissions assigned to a shared staff role
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: role, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  items: { type: integer }
      responses:
        '200': { description: Updated role permission matrix }
  /admin/staff:
    get:
      tags: [Admin]
      summary: List admin and staff accounts
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: role, schema: { type: string, enum: [admin, sales_manager, warehouse_staff, customer_service, content_editor, accountant, staff] } }
        - { in: query, name: status, schema: { type: string, enum: [active, blocked] } }
        - { in: query, name: last_login_from, schema: { type: string, format: date } }
        - { in: query, name: last_login_to, schema: { type: string, format: date } }
        - { in: query, name: sort, schema: { type: string, enum: [name, -name, email, -email, status, -status, last_login_at, -last_login_at, created_at, -created_at], default: -created_at } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Paginated staff accounts with avatar and contact fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/StaffListItem' } }
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer }
                      last_page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
                      status_counts:
                        type: object
                        required: [all, active, blocked, pending, invited]
                        properties:
                          all: { type: integer, minimum: 0 }
                          active: { type: integer, minimum: 0 }
                          blocked: { type: integer, minimum: 0 }
                          pending: { type: integer, minimum: 0 }
                          invited: { type: integer, minimum: 0 }
    post:
      tags: [Admin]
      summary: Create an admin or staff account
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffInput' }
      responses:
        '201': { description: Staff account created }
  /admin/staff/{staff}:
    patch:
      tags: [Admin]
      summary: Update role, profile, status or reset staff password
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: staff, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffInput' }
      responses:
        '200': { description: Staff account updated and sessions revoked if password or status changed }
    delete:
      tags: [Admin]
      summary: Soft delete a staff account
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: staff, required: true, schema: { type: integer } }
      responses:
        '200': { description: Staff account deleted }
  /admin/staff/{staff}/reset-2fa:
    post:
      tags: [Admin]
      summary: Reset two-factor authentication for a staff account
      description: Requires staff.security, recent authentication, an active ten-minute sudo session, and a reason. The current operator cannot reset their own 2FA; only the store owner may reset an admin account. Revokes the target's active sessions.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: staff, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200': { description: 2FA was reset and the staff member must enroll again }
        '403': { description: 'Missing staff.security, recent sudo confirmation, or owner role' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/staff/{staff}/performance:
    get:
      tags: [Admin]
      summary: Read a staff member's performance metrics
      description: Requires staff.view_performance. Commerce metrics are limited by the viewer's matching order, inventory, and review permissions. Only assignable admin or staff accounts are valid targets.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: staff, required: true, schema: { type: integer, minimum: 1 } }
        - { in: query, name: range, schema: { type: string, enum: [today, 7d, 30d], default: 7d } }
      responses:
        '200':
          description: Staff member's personal metrics and period comparison
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PersonalPerformance' }
        '401': { description: Missing or expired admin session }
        '403': { description: staff.view_performance permission is missing }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/staff/{staff}/sessions:
    delete:
      tags: [Admin]
      summary: Revoke all access and refresh sessions for a staff account
      description: Requires staff.security. The current operator cannot revoke their own sessions. Only the store owner may revoke sessions belonging to an admin account.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: staff, required: true, schema: { type: integer } }
      responses:
        '200': { description: Staff access and refresh sessions revoked }
        '403': { description: Missing staff.security or insufficient role to revoke an admin account's sessions }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/staff/{staff}/password-reset:
    post:
      tags: [Admin]
      summary: Send a password reset link to a staff account
      description: Requires staff.security. The current operator cannot request a reset for themselves; only the store owner may send a reset link to an admin account. The password reset link uses the standard single-use password broker.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: staff, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Password reset instructions sent to the staff member's email }
        '403': { description: Missing staff.security or owner role }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/payments/{payment}:
    get:
      tags: [Admin]
      summary: Get payment details and sanitized raw payload
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: payment, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Payment, order and customer details with sanitized raw payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      order_id: { type: integer }
                      order_code: { type: string }
                      method: { type: string }
                      amount: { type: integer }
                      status: { type: string, enum: [pending, success, paid, failed, refunded] }
                      transaction_ref: { type: string, nullable: true }
                      refunded_amount: { type: integer, minimum: 0 }
                      refundable_amount: { type: integer, minimum: 0 }
                      customer_name: { type: string }
                      customer_email: { type: string, nullable: true }
                      customer_phone: { type: string, nullable: true }
                      order_status: { type: string }
                      order_payment_status: { type: string }
                      raw_payload: { type: string, nullable: true }
                      refunds:
                        type: array
                        items:
                          type: object
                          required: [id, amount, reason, created_at]
                          properties:
                            id: { type: integer }
                            amount: { type: integer, minimum: 1 }
                            reason: { type: string }
                            recorded_by_name: { type: [string, 'null'] }
                            created_at: { type: [string, 'null'], format: date-time }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/payments/{payment}/refund:
    post:
      tags: [Admin]
      summary: Record a partial or full refund for a payment
      description: Requires orders.update_status. The payment amount is immutable; refund rows are appended, and total refunds cannot exceed the remaining amount.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: payment, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, reason]
              properties:
                amount: { type: integer, minimum: 1, description: Integer VND amount for this refund. }
                reason: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        '201':
          description: Refund recorded; response includes the remaining refundable balance and order payment status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      payment_id: { type: integer }
                      amount: { type: integer }
                      reason: { type: string }
                      order_payment_status: { type: string, enum: [paid, refunded] }
                      refunded_amount: { type: integer }
                      refundable_amount: { type: integer }
        '403': { description: Permission denied }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/banners/reorder:
    patch:
      tags: [Admin]
      summary: Reorder banners
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position, ids]
              properties:
                position: { type: string, enum: [home_hero, home_mid, hero, hero-mobile, campaign, category, popup] }
                ids: { type: array, minItems: 1, maxItems: 100, items: { type: integer } }
      responses:
        '200': { description: Banner order updated }
  /admin/customers/{customer}:
