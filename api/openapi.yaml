                        items:
                          type: object
                          required: [customer_ref, customer_name, order_count, spent]
                          properties:
                            customer_ref: { type: string, description: Stable app-keyed HMAC identifier for UI row keys. }
                            customer_name: { type: string }
                            order_count: { type: integer }
                            spent: { type: integer, description: Total paid order amount in VND. }
                      customer_repeat:
                        type: array
                        description: Customers with paid orders in the selected period, segmented by prior paid history matched by account ID, normalized email, or normalized phone.
                        items:
                          type: object
                          required: [customer_ref, customer_name, order_count, segment]
                          properties:
                            customer_ref: { type: string, description: Stable app-keyed HMAC identifier for UI row keys. }
                            customer_name: { type: string }
                            order_count: { type: integer }
                            segment: { type: string, enum: [new, returning] }
                      customer_locations:
                        type: array
                        items:
                          type: object
                          required: [province, order_count]
                          properties:
                            province: { type: string }
                            order_count: { type: integer }
