        - { in: query, name: has_products, description: Categories only; true returns categories with products and false returns categories without products., schema: { type: boolean } }
        - { in: query, name: status, description: Collections only; derived from active state and schedule., schema: { type: string, enum: [running, upcoming, expired, disabled] } }
