        - { in: query, name: days, schema: { type: integer, enum: [7, 30, 90], default: 7 } }
        - { in: query, name: from, schema: { type: string, format: date }, description: Start date for a custom inclusive range of at most 366 days; send together with to }
        - { in: query, name: to, schema: { type: string, format: date }, description: End date for a custom inclusive range; cannot be in the future }
