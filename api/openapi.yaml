  /admin/inventory:
    get:
      tags: [Admin]
      summary: List inventory with orders-aware available quantity
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: q, description: Search product name, variant SKU, or barcode, schema: { type: string } }
        - { in: query, name: low_stock, schema: { type: boolean } }
        - { in: query, name: stock_status, schema: { type: string, enum: [available, low, out] } }
        - { in: query, name: category_id, schema: { type: integer } }
        - { in: query, name: brand_id, schema: { type: integer } }
        - { in: query, name: color_value_id, schema: { type: integer } }
        - { in: query, name: size_value_id, schema: { type: integer } }
        - { in: query, name: sort, schema: { type: string, enum: [product_name, -product_name, sku, -sku, quantity, -quantity, available, -available, low_stock_threshold, -low_stock_threshold] } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Paginated inventory list with stock-status counts computed from search and category/brand/color/size filters while ignoring the selected stock status, plus available category, brand, color, and size filters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        variant_id: { type: integer }
                        sku: { type: string }
                        barcode: { type: [string, 'null'] }
                        color_value_id: { type: [integer, 'null'] }
                        size_value_id: { type: [integer, 'null'] }
                        color_name: { type: [string, 'null'] }
                        size_name: { type: [string, 'null'] }
                        product_name: { type: string }
                        product_slug: { type: string }
                        thumbnail: { type: [string, 'null'] }
                        quantity: { type: integer }
                        reserved: { type: integer }
                        low_stock_threshold: { type: integer }
                        last_movement_at: { type: [string, 'null'], format: date-time }
                        last_movement_type: { type: [string, 'null'] }
                        last_movement_change: { type: [integer, 'null'] }
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer }
                      last_page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
                  filters:
                    type: object
                    properties:
                      status_counts:
                        type: object
                        required: [all, available, low, out]
                        properties:
                          all: { type: integer, minimum: 0 }
                          available: { type: integer, minimum: 0 }
                          low: { type: integer, minimum: 0 }
                          out: { type: integer, minimum: 0 }
                      categories:
                        type: array
                        items:
                          type: object
                          required: [id, name]
                          properties:
                            id: { type: integer }
                            name: { type: string }
                            parent_name: { type: [string, 'null'] }
                      brands:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            name: { type: string }
                      colors:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            value: { type: string }
                      sizes:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            value: { type: string }
                            group_name: { type: string }
        '403': { description: Permission denied }
  /admin/products:
    get:
      tags: [Admin]
      summary: List products for administration, including drafts and archived products
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: q, description: Search product name, slug, product SKU, or variant SKU, schema: { type: string, maxLength: 120 } }
        - { in: query, name: status, schema: { type: string, enum: [draft, active, hidden, archived] } }
        - { in: query, name: category_id, schema: { type: integer } }
        - { in: query, name: 'category_ids[]', style: form, explode: true, description: Match any selected category (up to 50), schema: { type: array, maxItems: 50, items: { type: integer } } }
        - { in: query, name: brand_id, schema: { type: integer } }
        - { in: query, name: 'brand_ids[]', style: form, explode: true, description: Match any selected brand (up to 50), schema: { type: array, maxItems: 50, items: { type: integer } } }
        - { in: query, name: 'collection_ids[]', style: form, explode: true, description: Match products in any selected collection (up to 50), schema: { type: array, maxItems: 50, items: { type: integer } } }
        - { in: query, name: exclude_collection_id, description: Exclude products already assigned to this collection, schema: { type: integer, minimum: 1 } }
        - { in: query, name: target_gender, schema: { type: string, enum: [men, women, unisex, kids] } }
        - { in: query, name: is_featured, schema: { type: boolean } }
        - { in: query, name: is_new, description: Filter products marked as new arrivals, schema: { type: boolean } }
        - { in: query, name: in_stock, schema: { type: boolean } }
        - { in: query, name: stock_status, schema: { type: string, enum: [in_stock, low_stock, out_of_stock] } }
        - { in: query, name: has_sale, schema: { type: boolean } }
        - { in: query, name: has_image, schema: { type: boolean } }
        - { in: query, name: created_from, schema: { type: string, format: date } }
        - { in: query, name: created_to, schema: { type: string, format: date } }
        - { in: query, name: min_price, schema: { type: integer, minimum: 0 } }
        - { in: query, name: max_price, schema: { type: integer, minimum: 0 } }
        - { in: query, name: sort, schema: { type: string, enum: [created_at, -created_at, updated_at, -updated_at, name, -name, price, -price] } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: 'Paginated product rows include category/brand, images, variant counts, integer VND price, base price, sale price, total/available stock, and an archived status for soft-deleted rows. Status counts follow active list filters other than selected status and stock status.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: object, additionalProperties: true } }
                  filters:
                    type: object
                    properties:
                      status_counts:
                        type: object
                        required: [all, active, draft, hidden, archived, out_of_stock]
                        properties:
                          all: { type: integer, minimum: 0 }
                          active: { type: integer, minimum: 0 }
                          draft: { type: integer, minimum: 0 }
                          hidden: { type: integer, minimum: 0 }
                          archived: { type: integer, minimum: 0 }
                          out_of_stock: { type: integer, minimum: 0 }
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer, minimum: 1 }
                      last_page: { type: integer, minimum: 1 }
                      per_page: { type: integer, minimum: 1 }
                      total: { type: integer, minimum: 0 }
    post:
      tags: [Admin]
      summary: Create a product with its initial variants and stock
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, sku, category_id, target_gender, base_price, status, variants]
              properties:
                name: { type: string, maxLength: 255 }
                slug: { type: [string, 'null'] }
                sku: { type: string, maxLength: 64 }
                category_id: { type: integer }
                brand_id: { type: [integer, 'null'] }
                target_gender: { type: string, enum: [men, women, unisex, kids] }
                short_description: { type: [string, 'null'], maxLength: 500 }
                description: { type: [string, 'null'] }
                material: { type: [string, 'null'], maxLength: 255 }
                fit: { type: [string, 'null'], maxLength: 80 }
                care_instruction: { type: [string, 'null'], maxLength: 500 }
                base_price: { type: integer, minimum: 0 }
                compare_at_price: { type: [integer, 'null'], minimum: 0 }
                sale_starts_at: { type: [string, 'null'], format: date-time, description: Optional start of the product-wide discount window; prices on discounted variants apply from this time }
                sale_ends_at: { type: [string, 'null'], format: date-time, description: Optional inclusive end of the product-wide discount window }
                status: { type: string, enum: [draft, active, hidden] }
                is_featured: { type: boolean }
                is_new: { type: boolean }
                collection_ids: { type: array, maxItems: 50, items: { type: integer }, description: Collections to attach during product creation }
                meta_title: { type: [string, 'null'], maxLength: 255 }
                meta_description: { type: [string, 'null'], maxLength: 500 }
                tags: { type: array, maxItems: 20, items: { type: string, maxLength: 50 } }
                variants:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, price, initial_quantity]
                    properties:
                      sku: { type: string, maxLength: 64 }
                      barcode: { type: [string, 'null'], maxLength: 100 }
                      price: { type: integer, minimum: 0 }
                      compare_at_price: { type: [integer, 'null'], minimum: 0 }
                      color_value_id: { type: [integer, 'null'] }
                      size_value_id: { type: [integer, 'null'] }
                      initial_quantity: { type: integer, minimum: 0 }
                      weight_gram: { type: [integer, 'null'], minimum: 0 }
                      is_active: { type: boolean }
      responses:
        '201': { description: Product created }
        '422': { $ref: '#/components/responses/ValidationError' }
