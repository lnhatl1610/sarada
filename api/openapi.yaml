    get:
      tags: [Admin]
      summary: List coupons; requires coupons.view
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 120 } }
        - { in: query, name: campaign_status, description: "Derived coupon state filter; expiring selects active usable coupons ending within seven days.", schema: { type: string, enum: [running, upcoming, expiring, expired, disabled] } }
        - { in: query, name: campaign_type, schema: { type: string, enum: [percent, fixed, free_ship] } }
        - { in: query, name: from, description: "Inclusive start boundary for the coupon effective-date range.", schema: { type: string, format: date } }
        - { in: query, name: to, description: "Inclusive end boundary for the coupon effective-date range.", schema: { type: string, format: date } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { in: query, name: sort, schema: { type: string, enum: [code, -code, type, -type, value, -value, min_order_value, -min_order_value, used_count, -used_count, starts_at, -starts_at, expires_at, -expires_at, is_active, -is_active, created_at, -created_at], default: code } }
      responses:
        '200':
          description: Paginated coupons with quick status counts that honor search, type, and effective-date filters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: object, additionalProperties: true } }
                  meta: { type: object }
                  status_counts:
                    type: object
                    required: [all, running, upcoming, expiring, expired, disabled]
                    properties:
                      all: { type: integer, minimum: 0 }
                      running: { type: integer, minimum: 0 }
                      upcoming: { type: integer, minimum: 0 }
                      expiring: { type: integer, minimum: 0, description: Active coupons ending within seven days }
                      expired: { type: integer, minimum: 0 }
                      disabled: { type: integer, minimum: 0 }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Admin]
      summary: Create a coupon; requires coupons.manage
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignInput' }
      responses:
        '201': { description: Coupon created }
        '422': { $ref: '#/components/responses/ValidationError' }
