  /admin/notifications:
    get:
      tags: [Admin]
      summary: List the authenticated administrator's persistent notifications
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: per_page, schema: { type: integer, enum: [10, 25, 50], default: 25 } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: unread, schema: { type: boolean } }
        - { in: query, name: status, schema: { type: string, enum: [all, unread, archived] } }
        - { in: query, name: event, schema: { type: string, maxLength: 80 } }
