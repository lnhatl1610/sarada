  /admin/orders:
    get:
      tags: [Orders]
      summary: List/filter orders with orders.view permission
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [pending, confirmed, processing, shipping, delivery_failed, delivered, returned, completed, cancelled] } }
        - { in: query, name: queue, schema: { type: string, enum: [overdue, cancel_return] }, description: Overdue selects confirmed/processing orders unchanged for at least 24 hours; cancel_return selects orders with a pending cancellation or return request }
        - { in: query, name: payment_status, description: Use failed to find orders with at least one failed payment row, schema: { type: string, enum: [unpaid, paid, failed, refunded] } }
        - { in: query, name: payment_method, schema: { type: string, maxLength: 32 }, description: Filter by an exact method; the special value other matches methods outside COD and bank transfer }
        - { in: query, name: shipping_method_id, schema: { type: integer }, deprecated: true, description: Legacy single shipping-method filter }
        - { in: query, name: shipping_method_ids, schema: { type: string, pattern: '^\d+(,\d+)*$' }, description: Comma-separated shipping method IDs; matches any selected method }
        - { in: query, name: coupon_code, schema: { type: string, maxLength: 64 }, description: Exact coupon code }
        - { in: query, name: province_codes, schema: { type: string, maxLength: 640, pattern: '^[A-Za-z0-9_-]+(,[A-Za-z0-9_-]+)*$' }, description: Comma-separated province codes; matches any selected province }
        - { in: query, name: has_note, schema: { type: boolean }, description: Include orders with or without a customer/order note }
        - { in: query, name: q, description: "Search order code, recipient name, email, or phone", schema: { type: string, maxLength: 120 } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: min_total, schema: { type: integer, minimum: 0 } }
        - { in: query, name: max_total, schema: { type: integer, minimum: 0 } }
        - { in: query, name: sort, schema: { type: string, enum: [placed_at, -placed_at, grand_total, -grand_total] } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Paginated admin order list with shipping method options and failed payment attempt counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        code: { type: string }
                        customer_name: { type: string }
                        customer_phone: { type: string }
                        payment_method: { type: string }
                        payment_status: { type: string, enum: [unpaid, paid, refunded] }
                        item_count: { type: integer, minimum: 0, description: Total units in all order item snapshots }
                        failed_payment_count: { type: integer, minimum: 0, description: Failed payment attempts associated with this order }
                        grand_total: { type: integer, minimum: 0, description: Integer VND }
                  filters:
                    type: object
                    properties:
                      shipping_methods:
                        type: array
                        items:
                          type: object
                          required: [id, name]
                          properties:
                            id: { type: integer }
                            name: { type: string }
                      provinces:
                        type: array
                        items:
                          type: object
                          required: [province_code, province_name]
                          properties:
                            province_code: { type: string }
                            province_name: { type: string }
                      coupon_codes:
                        type: array
                        items: { type: string }
                      status_counts:
                        type: object
                        additionalProperties: { type: integer, minimum: 0 }
        '403': { description: Permission denied }
  /admin/orders/manual-options:
