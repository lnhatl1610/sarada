      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: customer, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerAdminInput' }
      responses:
        '200': { description: Customer updated; sessions revoked if blocked }
  /admin/customers/{customer}/status:
    patch:
      tags: [Admin]
      summary: Update customer status and revoke sessions when blocked
      description: Requires users.manage.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: customer, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: string, enum: [active, blocked] } } }
      responses:
        '200': { description: Updated customer }
  /admin/customers/{customer}/notes:
    post:
      tags: [Admin]
      summary: Add an internal customer note
      description: Requires users.manage. Notes are visible only in the admin customer detail.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: customer, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        '201': { description: Internal note created }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/products/{product}/details:
