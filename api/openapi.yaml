      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: product, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductDetailsInput' }
      responses:
        '200': { description: Updated product details }
  /admin/products/{product}/size-recommendations:
