        - { in: path, name: code, required: true, schema: { type: string, maxLength: 32 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [access_token], properties: { access_token: { type: string, minLength: 64, maxLength: 64, pattern: '^[a-f0-9]+$' } } }
      responses:
        '200': { description: Scoped order amount, payment status, and snapshotted bank instructions, content: { application/json: { schema: { $ref: '#/components/schemas/BankTransferInstructionsEnvelope' } } } }
        '404': { description: Payment instructions unavailable }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Public API rate limit exceeded }
  /orders:
    get:
      tags: [Orders]
      summary: List orders for the authenticated storefront user
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: status, description: "Status tab; processing groups confirmed/processing, shipping groups shipping/delivery_failed, delivered groups delivered/completed.", schema: { type: string, enum: [all, pending, processing, shipping, delivered, cancelled, returned], default: all } }
        - { in: query, name: q, description: Search order code or purchased product name, schema: { type: string, maxLength: 120 } }
        - { in: query, name: from, description: Filter placement date from (inclusive), schema: { type: string, format: date } }
        - { in: query, name: to, description: Filter placement date to (inclusive), schema: { type: string, format: date } }
      responses:
        '200':
          description: Paginated order summaries for the authenticated storefront user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerOrderListEnvelope' }
        '401': { description: Authentication required }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Orders]
      summary: Place a storefront order using an enabled payment method
      description: Accepts COD only while payment_cod_enabled is true, or bank_transfer only while the store has enabled transfer and supplied a valid bank account. Bank transfer reserves inventory, snapshots bank instructions, and remains unpaid until staff reconcile receipt. Recalculates prices, shipping, inventory, coupons, and authenticated-customer point redemption within the order transaction. Same-scope idempotent retries still return the original order and payment access token.
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - { in: header, name: X-Cart-Token, schema: { type: string } }
        - { in: header, name: Idempotency-Key, required: true, description: "Replay is scoped to the authenticated account or guest cart token; another scope cannot retrieve the existing order.", schema: { type: string, maxLength: 120 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_name, customer_phone, terms_accepted, payment_method]
              properties:
                customer_name: { type: string, maxLength: 160 }
                customer_email: { type: [string, 'null'], format: email }
                customer_phone: { type: string, maxLength: 32 }
                fulfillment_type: { type: string, enum: [delivery, pickup], default: delivery }
                pickup_location_id: { type: integer, minimum: 1, description: Required for pickup; must be active and have sufficient stock for every cart line. }
                shipping_address: { allOf: [{ $ref: '#/components/schemas/ShippingAddress' }], description: Required for delivery; omitted for pickup. }
                shipping_method_id: { type: [integer, 'null'], minimum: 1, description: Omit or send null to use province-based shipping; otherwise select an active configured method. }
                coupon_code: { type: [string, 'null'] }
                use_points: { type: boolean, default: false, description: Redeem available customer points; guests cannot use points. }
                note: { type: [string, 'null'] }
                invoice_requested: { type: boolean, default: false, description: Store a request for a VAT invoice with the order. }
                invoice_tax_code: { type: string, pattern: '^\d{10}(-\d{3})?$', maxLength: 14, description: Required when invoice_requested is true. }
                invoice_company_name: { type: string, maxLength: 255, description: Required when invoice_requested is true. }
                invoice_address: { type: string, maxLength: 500, description: Required when invoice_requested is true. }
                terms_accepted: { type: boolean, enum: [true], description: Shopper must accept the store terms before placing an order. }
                payment_method: { type: string, enum: [cod, bank_transfer], description: Must be enabled and configured in the store settings. }
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/StorefrontPlacedOrder'
        '200':
          description: Existing order for the idempotency key in the same caller scope; replay does not create order notifications
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/StorefrontPlacedOrder'
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Public API rate limit exceeded }
