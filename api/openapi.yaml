      summary: Get customer profile, addresses, orders, reviews, wishlist, cart and internal notes
      description: Requires customers.view.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: customer, required: true, schema: { type: integer } }
      responses:
        '200': { description: 'Customer profile and contact details, verification state, default-first addresses, recent orders, reviews, wishlist, cart line snapshots and totals, private staff notes, order count, delivered-order spending, average delivered order value, and latest order time' }
    patch:
